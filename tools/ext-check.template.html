<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>ext-check</title>
<style>body{font:14px/1.6 sans-serif;margin:20px}pre{background:#f4f4f4;padding:10px;white-space:pre-wrap}button{font-size:15px;padding:6px 14px;margin-right:8px}.bad{color:#c00;font-weight:bold}</style></head>
<body>
<h3>지원 확장자 빈 파일 시험</h3>
<p>1) <b>빈 폴더</b>를 하나 만드세요 (예: 다운로드\ext-test). 2) 아래 단추로 그 폴더를 고르면 빈(0바이트) 파일 {{COUNT}}개가 만들어지고, 브라우저가 돌려주는 이름과 비교합니다.</p>
<button id="a">A. 만들고 폴더 핸들로 읽기</button>
<button id="b">B. 같은 폴더를 파일 목록으로 읽기</button>
<input id="in" type="file" webkitdirectory hidden>
<pre id="out">(결과가 여기에 나옵니다)</pre>
<script>
const NAMES = /*NAMES*/[];
const out = document.getElementById("out");
function report(title, got) {
  const set = new Set(got);
  const missing = NAMES.filter(n => !set.has(n));
  out.innerHTML = title + " — 만든 것 " + NAMES.length + "개, 읽힌 것 " + NAMES.filter(n => set.has(n)).length + "개\n" +
    (missing.length ? '<span class="bad">빠진 것 ' + missing.length + '개:</span>\n' + missing.map(n => '<span class="bad">' + n + '</span>').join("\n") : "빠진 것 없음");
}
document.getElementById("a").onclick = async () => {
  try {
    const d = await showDirectoryPicker({ mode: "readwrite" });
    let existing = 0; for await (const _ of d.entries()) existing++;
    if (existing > 0 && !confirm("폴더가 비어 있지 않습니다(" + existing + "개). 그래도 파일을 만들까요?")) return;
    const failed = [];
    for (const n of NAMES) {
      try { const fh = await d.getFileHandle(n, { create: true }); const w = await fh.createWritable(); await w.close(); }
      catch (e) { failed.push(n + "  →  " + e); }
    }
    const got = [];
    for await (const [n] of d.entries()) got.push(n);
    report("A. 폴더 핸들", got);
    out.innerHTML += "\n\n<span class='bad'>만들기 실패 " + failed.length + "개:</span>\n" + (failed.length ? failed.map(f => "<span class='bad'>" + f + "</span>").join("\n") : "없음");
  } catch (e) { out.textContent = "A 오류: " + e; }
};
document.getElementById("b").onclick = () => document.getElementById("in").click();
document.getElementById("in").onchange = e => {
  report("B. 파일 목록", [...e.target.files].map(f => f.name));
};
</script></body></html>
