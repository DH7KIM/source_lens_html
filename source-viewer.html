<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Source Viewer</title>
<!--
  Source Viewer v0.48.0  (Source Lens: source_lens_html, MIT License, KIM DONG HAN)
  Source Viewer: 이 폴더의 소스 파일(C++ / Rust / 빌드 파일 / 마크다운)을 브라우저에서 바로 보는 단일 HTML 파일.
  - 외부 파일·라이브러리 없음. Chrome / Edge 권장 (File System Access API)
  - 처음 한 번 이 파일이 있는 폴더(source)를 고르면, 다음부터는 목록에서 클릭만으로 파일을 본다.
  - 목록은 트리 구조(가지 연결선 ├ └): 폴더를 눌러 접기·펼치기 (브라우저에 기억). 접힌 폴더 안에 지금 파일이 있으면 강조색.
  - 문법 색칠 + 줄 번호 (C++, Rust, TOML, JSON, BAT, 셸/YAML/Makefile). 줄 번호는 복사할 때 딸려 오지 않는다.
  - .ui (UI 레이아웃 형식 1, ui-guideline 문서 0.9): 색칠 + 전체 검사(E001~E016, W101·W103·W104).
    옛 이름(tip, check, item 등)도 읽고 경고 W104로 새 이름을 알려 준다.
    오류는 빨간 밑줄, 경고는 주황 밑줄. 줄 아래에 코드·설명·추천(help)을 표시 (끄고 켤 수 있음). .ui.log도 색칠.
  - .md는 문서로 보기 / 원문 보기 전환. 한국어(이름.ko.md) / 영어(이름.md) 전환.
  - 파일을 고쳐서 저장하면 1초 안에 화면이 바뀐다. UTF-8이 아니면 EUC-KR(CP949)·UTF-16으로 읽는다.
-->
<style>
  :root {
    --bg: #faf9f5; --fg: #1f1e1d; --muted: #6b6a66; --line: #e3e0d6; --panel: #f0eee6;
    --code-fg: #b4386b; --link: #2f6fc0; --th: #f3f1ea; --accent: #c96442; --side: #f5f3ec; --sel: #e8e4d8;
    --font: "Segoe UI", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, "D2Coding", "Malgun Gothic", monospace;
    /* 문법 색: 키워드, 타입, 문자열, 주석, 숫자·상수, 전처리·속성, 함수·매크로 */
    --hk: #a0365e; --ht: #2a6f97; --hs: #3d7a2a; --hc: #8a8780; --hn: #b5651d; --hp: #7b4fa0; --hf: #2f6fc0;
    /* 오류 빨강(--err)과 헷갈리지 않게 쓰는 색: 보통 --hk·--hp와 같고, 빨강 계열인 테마(GitHub, Gruvbox)만 따로 정함. false·.bat·.json 점·계층 보기 아이콘에 씀 */
    --hk2: var(--hk); --hp2: var(--hp);
    --err: #d03030; /* 오류: 빨간 글자 */
    --warn: #b06a00; /* 경고: 주황 (.ui W1xx) */
    --hl: color-mix(in srgb, var(--accent) 22%, var(--bg)); /* 선택한 줄 */
    --hover: color-mix(in srgb, var(--fg) 8%, var(--bg));   /* 마우스를 올린 줄 */
    --hl-hover: color-mix(in srgb, var(--accent) 32%, var(--bg));   /* 선택한 줄 + 마우스 */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #262624; --fg: #ecebe6; --muted: #a3a29c; --line: #3d3c38; --panel: #1f1e1c;
      --code-fg: #f08ab4; --link: #7fb0f0; --th: #2f2e2b; --side: #2b2a27; --sel: #3a3935;
      --hk: #f08ab4; --ht: #7fc7d9; --hs: #a6d189; --hc: #85837c; --hn: #f2a86b; --hp: #c6a0f6; --hf: #7fb0f0; --err: #ff6b6b; --warn: #e8a33d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #262624; --fg: #ecebe6; --muted: #a3a29c; --line: #3d3c38; --panel: #1f1e1c;
    --code-fg: #f08ab4; --link: #7fb0f0; --th: #2f2e2b; --side: #2b2a27; --sel: #3a3935;
    --hk: #f08ab4; --ht: #7fc7d9; --hs: #a6d189; --hc: #85837c; --hn: #f2a86b; --hp: #c6a0f6; --hf: #7fb0f0; --err: #ff6b6b; --warn: #e8a33d;
  }
  /* 그 밖의 테마는 아래 스크립트의 THEMES 표에서 CSS 변수로 넣는다 */

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 16px/1.7 var(--font); }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center; padding: 3px 16px; flex-wrap: wrap; min-height: var(--row);
  }
  header .name { font-weight: 600; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  header .state { color: var(--muted); font-size: 13px; }
  header .state.err, header .state .bad { color: var(--err); }
  header .state .bad { font-weight: 600; cursor: help; }
  header .state .warn { color: var(--warn); font-weight: 600; cursor: help; }
  header .state .okay { cursor: help; }
  button, select {
    font: inherit; font-size: 14px; color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--muted); }
  button.on { border-color: var(--accent); color: var(--accent); }
  .wrap { display: flex; align-items: flex-start; }
  nav {
    position: sticky; top: var(--hdr, 49px); width: var(--nav-w, 230px); flex: none; max-height: calc(100vh - var(--hdr, 49px)); overflow: auto;
    padding: 16px 8px; border-right: 1px solid var(--line); background: var(--side); min-height: calc(100vh - var(--hdr, 49px));
  }
  /* 목록 폭 조절: 오른쪽 경계를 끌거나, 두 번 클릭하면 가장 긴 이름에 맞춤 */
  #navSize {
    position: sticky; top: var(--hdr, 49px); width: 6px; margin-left: -3px; flex: none; z-index: 1;
    height: calc(100vh - var(--hdr, 49px)); cursor: col-resize; background: transparent;
  }
  #navSize:hover, body.resizing #navSize { background: var(--accent); opacity: 0.5; }
  body.resizing { cursor: col-resize; user-select: none; }
  /* 트리: 깊이(--d)마다 14px 들여쓰기. 폴더 줄은 ▸ 화살표 + 폴더 아이콘 */
  nav .dir, nav a { padding: 3px 10px 3px calc(10px + var(--d, 0) * 14px); }
  nav .dir {
    display: flex; align-items: center; gap: 4px; border-radius: 6px; color: var(--muted); font-size: 14px;
    cursor: pointer; white-space: nowrap; user-select: none;
  }
  nav .dir:hover { background: var(--sel); color: var(--fg); }
  nav .dir .tw { width: 12px; height: 12px; flex: none; transition: transform 0.12s; }
  nav .dir.open .tw { transform: rotate(90deg); }
  nav .dir .fi { width: 15px; height: 15px; flex: none; margin-right: 2px; }
  /* 가지 연결선: ├ └ │ (각 칸 14px, 부모 폴더 화살표 가운데에 세로선) */
  nav .dir, nav a { position: relative; }
  nav .chunk { content-visibility: auto; contain-intrinsic-size: auto 5960px; }   /* 200줄 × 약 29.8px. 화면 밖 묶음은 그리지 않음 */
  nav .g { position: absolute; top: 0; bottom: 0; left: calc(10px + var(--k) * 14px); width: 14px; pointer-events: none; color: var(--muted); }
  nav .g::before, nav .g.t::after, nav .g.l::after { content: ""; position: absolute; opacity: 0.5; }
  nav .g::before { left: 6px; top: 0; bottom: 0; border-left: 1px solid; }
  nav .g.l::before { bottom: 50%; }
  nav .g.t::after, nav .g.l::after { left: 6px; top: 50%; width: 7px; border-top: 1px solid; }
  nav .g.f::after { width: 16px; }
  nav .dir.has-cur { color: var(--accent); font-weight: 600; } /* 접힌 폴더 안에 지금 파일이 있음 */
  nav a {
    display: block; padding-left: calc(26px + var(--d, 0) * 14px); border-radius: 6px; color: var(--fg); text-decoration: none;
    font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
  }
  nav a:hover { background: var(--sel); }
  nav a.cur { background: var(--sel); font-weight: 600; }
  nav a .alt { color: var(--muted); font-size: 12px; margin-left: 4px; }
  nav a .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: var(--muted); }
  nav a .dot.cpp { background: var(--hf); } nav a .dot.rust { background: var(--hn); } nav a .dot.md { background: var(--hs); }
  nav a .dot.toml, nav a .dot.json, nav a .dot.json5 { background: var(--hp2); } nav a .dot.bat, nav a .dot.hash { background: var(--hk2); }
  nav a .dot.ui { background: var(--ht); } nav a .dot.uilog { background: var(--hc); }
  main { flex: 1; min-width: 0; }
  /* 단추 줄: 파일마다 달라지는 단추(보기 전환·오류 설명·마크다운 모드·미리보기). 파일을 열면 늘 보이고 높이 고정 */
  body { --row: 49px; --bar: 0px; } /* 머리 막대와 단추 줄의 높이를 같게 */
  body.has-bar { --bar: var(--row); }
  #fileBar { position: sticky; top: var(--hdr, 49px); z-index: 1; height: var(--row); display: flex; gap: 8px; align-items: center; padding: 0 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
  #fileBar[hidden] { display: none; }
  #wrapBtn[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 700; }
  article, .start { max-width: 820px; margin: 0 auto; padding: 24px 24px 80px; }
  .start { margin-top: 8vh; text-align: center; color: var(--muted); }
  .start .box { border: 2px dashed var(--line); border-radius: 16px; padding: 40px 16px; }
  .start button { margin: 8px 4px; font-size: 15px; padding: 6px 16px; }
  .start .note { font-size: 13px; margin-top: 16px; }
  body.dragging .start .box { border-color: var(--accent); }

  /* 소스 보기: 자기 영역 안에서 스크롤, 줄 번호는 왼쪽에 고정 */
  .code { position: sticky; top: calc(var(--hdr, 49px) + var(--bar)); height: calc(100vh - var(--hdr, 49px) - var(--bar)); overflow: auto; font: 13.5px/1.6 var(--mono); }
  .code .lines { display: inline-block; min-width: 100%; padding: 8px 0 40px; }
  .code .r { display: flex; }
  .code .no {
    flex: none; position: sticky; left: 0; width: var(--no-w, 5ch); padding: 0 12px 0 8px; text-align: right;
    color: var(--muted); background: var(--bg); border-right: 1px solid var(--line); cursor: pointer; user-select: none;
  }
  .code .no::before { content: attr(data-n); } /* 글자가 아니므로 복사되지 않음 */
  .code .no:hover { color: var(--fg); }
  .code .tx { flex: 1; white-space: pre; padding: 0 24px 0 14px; tab-size: 4; -moz-tab-size: 4; }
  /* 자동 줄바꿈: 긴 줄을 화면 너비에서 접음. 줄 번호는 첫 줄에만 (칸이 위쪽 맞춤) */
  .code.wrap .lines { display: block; min-width: 0; }
  .code.wrap .tx { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* 줄 강조: 선택한 줄은 강조색 배경 + 왼쪽 굵은 막대(색만으로 구분하지 않음), 마우스를 올린 줄은 연한 배경 */
  .code .r.hl .tx, .code .r.hl .no { background: var(--hl); color: var(--fg); }
  .code .r.hl .no { box-shadow: inset 3px 0 0 var(--accent); }
  .code .r:not(.dg):not(.hl):hover .tx, .code .r:not(.dg):not(.hl):hover .no { background: var(--hover); }
  .code .r.hl .sel-item { background: color-mix(in srgb, var(--accent) 42%, var(--bg)); border-radius: 3px; }   /* 계층 보기에서 고른 항목의 글자 범위 */
  .code .r.hl:hover .tx, .code .r.hl:hover .no { background: var(--hl-hover); }   /* 선택한 줄에 올려도 선택 모양이 유지되고 조금 더 진해짐 */
  .code .msg { padding: 24px; color: var(--muted); font-family: var(--font); }
  .k { color: var(--hk); } .t { color: var(--ht); } .s { color: var(--hs); } .c { color: var(--hc); font-style: italic; }
  .n { color: var(--hn); } .p { color: var(--hp); } .f { color: var(--hf); }
  /* 오류: 빨간 글자 + 물결 밑줄 (색만으로 구분하지 않게), 줄 번호도 빨강 */
  .e { color: var(--err); text-decoration: underline wavy var(--err); text-underline-offset: 3px; text-decoration-skip-ink: none; cursor: help; }
  .wn { text-decoration: underline wavy var(--warn); text-underline-offset: 3px; text-decoration-skip-ink: none; cursor: help; }
  .x { color: var(--err); font-weight: 600; }
  .code .r.bad .no { color: var(--err); font-weight: 700; }
  .code .r.warn .no { color: var(--warn); font-weight: 700; }
  /* 줄 아래 진단: 줄 번호 없음, 선택·복사 안 됨 */
  .code .r.dg { user-select: none; background: color-mix(in srgb, var(--err) 7%, transparent); }
  .code .r.dg .no { cursor: default; }
  .code .r.dg [data-t]::before { content: attr(data-t); }
  .code .r.dg .pad { color: transparent; }
  .code .r.dg .dm { color: var(--err); }
  .code .r.dg.dw { background: color-mix(in srgb, var(--warn) 9%, transparent); }
  .code .r.dg.dw .x, .code .r.dg.dw .dm { color: var(--warn); }
  .code .r.dg .dh { color: var(--muted); }
  .code .r.dg.dn { background: color-mix(in srgb, var(--muted) 8%, transparent); }
  .code .r.dg.dn .x, .code .r.dg.dn .dm { color: var(--muted); }

  /* .ui 배치 미리보기: 위(소스) / 경계 / 아래(배치). 아래 칸 높이 = --pv-h */
  body.pv-on .code { height: calc(100vh - var(--hdr, 49px) - var(--bar) - var(--pv-h, 300px) - 6px); }
  #pvSize { height: 6px; cursor: row-resize; background: var(--line); }
  #pvSize:hover, body.resizing-v #pvSize { background: var(--accent); opacity: 0.6; }
  body.resizing-v { cursor: row-resize; user-select: none; }
  #pv { height: var(--pv-h, 300px); display: flex; flex-direction: column; background: var(--side); }
  #pv[hidden], #pvSize[hidden] { display: none; }
  .pv-bar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .pv-bar input { width: 6ch; } .pv-bar label { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
  .pv-bar .bad { color: var(--err); font-weight: 600; }
  .pv-stage { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
  .pv-msg { color: var(--err); font-weight: 600; padding: 4px; }
  .pv-win { position: relative; background: var(--bg); border: 1px solid var(--muted); box-sizing: content-box; overflow: hidden; color: var(--fg); }
  .pv-win > div { position: absolute; box-sizing: border-box; overflow: hidden; white-space: pre; display: flex; align-items: center; }
  .pv-win .pv-label { justify-content: flex-start; }
  .pv-win .pv-button, .pv-win .pv-menu_button { border: 1px solid var(--muted); border-radius: 4px; background: var(--panel); justify-content: center; }
  .pv-win .pv-menu_button { justify-content: space-between; padding: 0 6px; }
  .pv-win .pv-text_field, .pv-win .pv-number_field { border: 1px solid var(--muted); border-radius: 2px; padding: 0 5px; background: var(--bg); }
  .pv-win .pv-checkbox { background: var(--bg); }
  .pv-win .pv-number_field { justify-content: space-between; }
  .pv-win .pv-text_field .h { color: var(--muted); }
  .pv-win .pv-canvas { border: 1px solid var(--line); background: repeating-linear-gradient(45deg, var(--line) 0 1px, transparent 1px 8px); }
  .pv-win .pv-group, .pv-win .pv-row, .pv-win .pv-column { border: 1px dashed var(--muted); align-items: flex-start; }
  /* 묶음 이름표는 오른쪽 위 구석에 (자식이 왼쪽 위부터 놓이므로 덜 가림). 자식이 뒤에 그려져 위를 덮음 */
  .pv-win .tag { position: absolute; top: 0; right: 0; font-size: 10px; line-height: 1; color: var(--muted); padding: 1px 3px; opacity: 0.8; }
  .pv-win .pv-hidden { opacity: 0.3; } .pv-win .pv-disabled { color: var(--muted); }
  .pv-win > div { cursor: pointer; }
  .pv-win > div:hover { outline: 2px solid var(--accent); outline-offset: -1px; z-index: 1; }
  /* 표시한 소스 줄의 상자: 굵은 테두리 + 선택 배경 (색만으로 구분하지 않음) */
  .pv-win > div.pv-cur { outline: 3px solid var(--accent); outline-offset: -2px; background-color: var(--sel); z-index: 2; }
  /* 배치 | 보기 모드 버튼 (눌린 쪽은 강조색 + 굵은 글자, 색만으로 구분하지 않음) */
  .pv-mode { display: inline-flex; } .pv-mode button { border-radius: 0; margin: 0; }
  .pv-mode button:first-child { border-radius: 4px 0 0 4px; } .pv-mode button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
  .pv-mode button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 700; }
  /* 보기 모드: menu_button만 누를 수 있음, 펼친 메뉴는 창 밖으로 나갈 수 있게 .pv-wrap에 둠 */
  .pv-wrap { position: relative; display: inline-block; }
  .pv-view .pv-win > div { cursor: default; } .pv-view .pv-win > div:hover { outline: none; }
  .pv-view .pv-win > div.pv-cur { outline: none; background-color: transparent; }
  .pv-view .pv-win > div.pv-menu_button { cursor: pointer; } .pv-view .pv-win > div.pv-menu_button:hover { outline: 2px solid var(--accent); outline-offset: -1px; }
  .pv-view .pv-win > div.pv-open { outline: 2px solid var(--accent); outline-offset: -1px; }
  .pv-pop { position: absolute; z-index: 10; min-width: 120px; padding: 3px 0; background: var(--panel); color: var(--fg); border: 1px solid var(--muted);
    box-shadow: 0 4px 12px rgba(0,0,0,.3); white-space: pre; cursor: default; }
  .pv-pop .mi { position: relative; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 4px; }
  .pv-pop .mi:hover { background: var(--sel); }
  .pv-pop .mi .mk { width: 1.4em; text-align: center; flex: none; } .pv-pop .mi .tx { flex: 1; } .pv-pop .mi .ar { color: var(--muted); }
  .pv-pop .mi.dis { color: var(--muted); }
  .pv-pop .sep { border-top: 1px solid var(--line); margin: 3px 0; }
  /* 보기 모드 풍선 도움말: 창·미리보기 영역 밖으로도 나갈 수 있게 fixed */
  .pv-tooltip { position: fixed; z-index: 100; pointer-events: none; max-width: min(480px, calc(100vw - 16px)); padding: 3px 7px;
    background: var(--panel); color: var(--fg); border: 1px solid var(--muted); border-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,.3);
    white-space: pre-wrap; overflow-wrap: anywhere; }
  .pv-tooltip[hidden] { display: none; }
  .pv-pop .mi > .pv-pop { display: none; left: 100%; top: -4px; } .pv-pop .mi:hover > .pv-pop { display: block; }

  /* 소스 보기 | 계층 보기 단추 (눌린 쪽은 강조색 + 굵은 글자, 색만으로 구분하지 않음) */
  .mode-seg { display: inline-flex; } .mode-seg[hidden] { display: none; } .mode-seg button { border-radius: 0; margin: 0; }
  .mode-seg button:first-child { border-radius: 8px 0 0 8px; } .mode-seg button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
  .mode-seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 700; }

  .tj-root { padding: 8px 12px 40px; font: 13.5px/1.6 var(--mono); }

  .tj-sp { width: 12px; flex: none; }
  .tj-dot { width: 12px; height: 16px; flex: none; display: inline-flex; align-items: center; justify-content: center; }
  .tj-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  /* 점 색 = 값의 종류 (문자열·숫자·true/false/null), 파일 목록의 종류별 점과 같은 모양 */
  .tj-dot.s::before { background: var(--hs); } .tj-dot.n::before { background: var(--hn); }
  .tj-dot.tj-true::before { background: var(--ht); } .tj-dot.tj-false::before { background: var(--hk2); } .tj-dot.tj-null::before { background: var(--hc); }

  .tj-esrc { color: var(--fg); font-weight: 400; white-space: pre; overflow: hidden; background: color-mix(in srgb, var(--err) 7%, transparent); }

  /* 단계마다 16px 들여쓰기 (14px + 선과 화살표가 겹치지 않게 2px). 세로선은 위 항목 화살표 가운데(8+6=14px), 가로선 11px는 점·화살표 바로 앞까지 */
  .tj-kids { margin-left: 14px; }
  .tj-kids > * { position: relative; }
  .tj-kids > .tj { padding-left: 2px; }   /* 묶음(화살표) 줄은 가지선 가까이 */
  .tj-kids > .tj-errbox { padding-left: 8px; }   /* 오류 안내 글자는 값 줄의 키 이름과 같은 자리 (8 + 8 + 12 + 4 = 16 + 12 + 4) */
  .tj-kids > .tj-row { padding-left: 16px; }   /* 16 = 8(가지선 끝과 점 사이, 파일 목록의 파일 줄과 같음) + 8(줄 자체 안쪽 여백). 화살표 줄은 파일 목록의 폴더 줄처럼 선 가까이 */
  .tj-kids > *::before, .tj-kids > *::after { content: ""; position: absolute; left: 0; opacity: 0.5; pointer-events: none; }
  .tj-kids > *::before { top: 0; bottom: 0; border-left: 1px solid var(--muted); }
  .tj-kids > *::after { top: 11px; width: 11px; border-top: 1px solid var(--muted); }

// 언어 이름은 번역하지 않고 각 언어 자신의 이름으로 (화면 언어를 못 읽어도 찾을 수 있게). 이 표의 순서가 언어 목록 상자의 순서

// 브라우저 언어 태그 → 언어 코드: zh-TW·zh-HK·zh-MO·zh-Hant → zh-tw, 그 밖의 zh → zh-cn, 나머지는 앞 부분 (ja-JP → ja)
function langCodeOf(tag) {
  const s = String(tag).toLowerCase();
  if (s.startsWith("zh")) return /hant|-tw|-hk|-mo/.test(s) ? "zh-tw" : "zh-cn";
  return s.split("-")[0];
}
// 브라우저 선호 언어 목록을 앞에서부터 보고 화면 글자 표(UI)가 있는 첫 언어를 고름, 없으면 en
function pickUiLang() {
  for (const tag of navigator.languages?.length ? navigator.languages : [navigator.language || "en"]) {
    const c = langCodeOf(tag);
    if (UI[c]) return c;
  }
  return "en";

/// 글 → [[클래스, 글], ...]
function highlight(src, lang) {
  if (lang === "ui") return highlightUi(src);
  const rules = RULES[LANG_ALIAS[lang] || lang];
  if (!rules) return [[null, src]];
  const out = [];
  let plain = "";
  const push = (cls, text) => {
    if (!text) return;
    if (!cls) { plain += text; return; }
    if (plain) { out.push([null, plain]); plain = ""; }
    out.push([cls, text]);
  };
  let pos = 0;
  outer: while (pos < src.length) {
    for (const r of rules) {
      const n = r(src, pos, push);
      if (n > pos) { pos = n; continue outer; }
    }
    // 아무 규칙도 맞지 않으면 이름이 아닌 글자를 한꺼번에 넘긴다
    const rx = /[^\w"'#/$%!@:;\[\-\.+]+|[\s\S]/y; rx.lastIndex = pos;
    const m = rx.exec(src)[0];
    push(null, m); pos += m.length;
  }
  if (plain) out.push([null, plain]);
  return out;
}

//   type: object | array | string | number | boolean | null
//   key : 객체 멤버는 이름(문자열), 배열 원소는 번호(숫자), 뿌리는 null
//   id  : 노드 번호 (읽은 순서, 0부터)
//   line: 소스의 줄 번호 (객체 멤버는 키가 있는 줄)

// 틀리면 Error: e.message(영어), e.line(줄 번호), e.code(J001…), e.pos(소스 안 위치, UTF-16), e.len(길이, UTF-16), e.args

// 줄을 따로따로 json5Tree로 읽는다. 틀린 줄은 오류 항목({ type: "error" })으로 두고 나머지는 계속 읽는다 (줄끼리 영향이 없어서 오류 복구가 필요 없다).
// 뿌리: { type: "array", lines: true, id: 0, kids, okCount, badCount, bads, count }. 항목의 key는 0부터 번호, line은 소스의 줄 번호.
// 틀린 줄: 오류 직전까지 읽은 부분 트리가 있으면 그 줄의 항목으로 두고(오류 자리에 err, 줄 정보 errLine = { line, text }), 읽은 것이 없으면 오류 항목 { type: "error", key, id, line, col: 0, ec: -1, err: e, text: 그 줄 글 }.

function json5Lines(text, strict) {
  const kids = [], bads = [];
  let id = 1, ok = 0, bad = 0;
  text.split("\n").forEach((raw, k) => {
    const ln = raw.replace(/\r$/, "");
    if (ln.trim() === "" || (!strict && /^\s*\/\//.test(ln))) return;   // 빈 줄·주석만 있는 줄은 건너뜀
    try {
      const n = json5Tree(ln, { line0: k, id0: id, strict });
      n.key = kids.length; id = n.count; ok++; kids.push(n);
    } catch (e) {
      if (!e || e.code === undefined) throw e;
      bads.push({ err: e, line: k + 1, text: ln }); bad++;
      if (e.node) { const n = e.node; n.key = kids.length; id = n.count; n.errLine = { line: k + 1, text: ln }; kids.push(n); }   // 오류 직전까지 읽은 부분
      else kids.push({ type: "error", key: kids.length, id: id++, line: k + 1, col: 0, ec: -1, err: e, text: ln });

// 파일 전체로 읽다가 값 뒤에 글자가 남았을 때(J010, e = 그 오류) JSON Lines인지 판단해 줄 트리를 돌려준다 (아니면 null).
// 조건: 첫 값이 끝난 뒤 줄이 바뀌어서 글자가 시작하고, 읽힌 줄이 2개 이상이며 틀린 줄보다 적지 않다 (한 파일 JSON의 꼬리 글자와 구별).
