<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Source Viewer</title>
<!--
  Source Viewer v0.1.0  (Source Lens: source_lens_html, MIT License, KIM DONG HAN)
  Source Viewer: 이 폴더의 소스 파일(C++ / Rust / 빌드 파일 / 마크다운)을 브라우저에서 바로 보는 단일 HTML 파일.
  - 외부 파일·라이브러리 없음. Chrome / Edge 권장 (File System Access API)
  - 처음 한 번 이 파일이 있는 폴더(source)를 고르면, 다음부터는 목록에서 클릭만으로 파일을 본다.
  - 목록은 트리 구조(가지 연결선 ├ └): 폴더를 눌러 접기·펼치기 (브라우저에 기억). 접힌 폴더 안에 지금 파일이 있으면 강조색.
  - 문법 색칠 + 줄 번호 (C++, Rust, TOML, JSON, BAT, 셸/YAML/Makefile). 줄 번호는 복사할 때 딸려 오지 않는다.
  - .ui (UI 레이아웃 형식 1, ui-guideline 문서 0.7): 색칠 + 간단 검사(E002, E003, E013)를 빨간 밑줄로,
    오류 줄 아래에 오류 코드·설명·추천(help)을 표시 (끄고 켤 수 있음). .ui.log도 색칠.
  - .md는 문서로 보기 / 원문 보기 전환. 한국어(이름.ko.md) / 영어(이름.md) 전환.
  - 파일을 고쳐서 저장하면 1초 안에 화면이 바뀐다. UTF-8이 아니면 EUC-KR(CP949)·UTF-16으로 읽는다.
-->
<style>
  :root {
    --bg: #faf9f5; --fg: #1f1e1d; --muted: #6b6a66; --line: #e3e0d6; --panel: #f0eee6;
    --code-fg: #b4386b; --link: #2f6fc0; --th: #f3f1ea; --accent: #c96442; --side: #f5f3ec; --sel: #e8e4d8;
    --font: "Segoe UI", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, "D2Coding", "Malgun Gothic", monospace;
    /* 문법 색: 키워드, 타입, 문자열, 주석, 숫자·상수, 전처리·속성, 함수·매크로 */
    --hk: #a0365e; --ht: #2a6f97; --hs: #3d7a2a; --hc: #8a8780; --hn: #b5651d; --hp: #7b4fa0; --hf: #2f6fc0;
    --err: #d03030; /* 오류: 빨간 글자 */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #262624; --fg: #ecebe6; --muted: #a3a29c; --line: #3d3c38; --panel: #1f1e1c;
      --code-fg: #f08ab4; --link: #7fb0f0; --th: #2f2e2b; --side: #2b2a27; --sel: #3a3935;
      --hk: #f08ab4; --ht: #7fc7d9; --hs: #a6d189; --hc: #85837c; --hn: #f2a86b; --hp: #c6a0f6; --hf: #7fb0f0; --err: #ff6b6b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #262624; --fg: #ecebe6; --muted: #a3a29c; --line: #3d3c38; --panel: #1f1e1c;
    --code-fg: #f08ab4; --link: #7fb0f0; --th: #2f2e2b; --side: #2b2a27; --sel: #3a3935;
    --hk: #f08ab4; --ht: #7fc7d9; --hs: #a6d189; --hc: #85837c; --hn: #f2a86b; --hp: #c6a0f6; --hf: #7fb0f0; --err: #ff6b6b;
  }
  /* 그 밖의 테마는 아래 스크립트의 THEMES 표에서 CSS 변수로 넣는다 */

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 16px/1.7 var(--font); }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center; padding: 8px 16px; flex-wrap: wrap; min-height: var(--hdr, 49px);
  }
  header .name { font-weight: 600; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  header .state { color: var(--muted); font-size: 13px; }
  header .state.err, header .state .bad { color: var(--err); }
  header .state .bad { font-weight: 600; cursor: help; }
  button, select {
    font: inherit; font-size: 14px; color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--muted); }
  button.on { border-color: var(--accent); color: var(--accent); }
  .wrap { display: flex; align-items: flex-start; }
  nav {
    position: sticky; top: var(--hdr, 49px); width: var(--nav-w, 230px); flex: none; max-height: calc(100vh - var(--hdr, 49px)); overflow: auto;
    padding: 16px 8px; border-right: 1px solid var(--line); background: var(--side); min-height: calc(100vh - var(--hdr, 49px));
  }
  /* 목록 폭 조절: 오른쪽 경계를 끌거나, 두 번 클릭하면 가장 긴 이름에 맞춤 */
  #navSize {
    position: sticky; top: var(--hdr, 49px); width: 6px; margin-left: -3px; flex: none; z-index: 1;
    height: calc(100vh - var(--hdr, 49px)); cursor: col-resize; background: transparent;
  }
  #navSize:hover, body.resizing #navSize { background: var(--accent); opacity: 0.5; }
  body.resizing { cursor: col-resize; user-select: none; }
  /* 트리: 깊이(--d)마다 14px 들여쓰기. 폴더 줄은 ▸ 화살표 + 폴더 아이콘 */
  nav .dir, nav a { padding: 3px 10px 3px calc(10px + var(--d, 0) * 14px); }
  nav .dir {
    display: flex; align-items: center; gap: 4px; border-radius: 6px; color: var(--muted); font-size: 14px;
    cursor: pointer; white-space: nowrap; user-select: none;
  }
  nav .dir:hover { background: var(--sel); color: var(--fg); }
  nav .dir .tw { width: 12px; height: 12px; flex: none; transition: transform 0.12s; }
  nav .dir.open .tw { transform: rotate(90deg); }
  nav .dir .fi { width: 15px; height: 15px; flex: none; margin-right: 2px; }
  /* 가지 연결선: ├ └ │ (각 칸 14px, 부모 폴더 화살표 가운데에 세로선) */
  nav .dir, nav a { position: relative; }
  nav .g { position: absolute; top: 0; bottom: 0; left: calc(10px + var(--k) * 14px); width: 14px; pointer-events: none; color: var(--muted); }
  nav .g::before, nav .g.t::after, nav .g.l::after { content: ""; position: absolute; opacity: 0.5; }
  nav .g::before { left: 6px; top: 0; bottom: 0; border-left: 1px solid; }
  nav .g.l::before { bottom: 50%; }
  nav .g.t::after, nav .g.l::after { left: 6px; top: 50%; width: 7px; border-top: 1px solid; }
  nav .g.f::after { width: 16px; }
  nav .dir.has-cur { color: var(--accent); font-weight: 600; } /* 접힌 폴더 안에 지금 파일이 있음 */
  nav a {
    display: block; padding-left: calc(26px + var(--d, 0) * 14px); border-radius: 6px; color: var(--fg); text-decoration: none;
    font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
  }
  nav a:hover { background: var(--sel); }
  nav a.cur { background: var(--sel); font-weight: 600; }
  nav a .alt { color: var(--muted); font-size: 12px; margin-left: 4px; }
  nav a .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: var(--muted); }
  nav a .dot.cpp { background: var(--hf); } nav a .dot.rust { background: var(--hn); } nav a .dot.md { background: var(--hs); }
  nav a .dot.toml, nav a .dot.json { background: var(--hp); } nav a .dot.bat, nav a .dot.hash { background: var(--hk); }
  nav a .dot.ui { background: var(--ht); } nav a .dot.uilog { background: var(--hc); }
  main { flex: 1; min-width: 0; }
  article, .start { max-width: 820px; margin: 0 auto; padding: 24px 24px 80px; }
  .start { margin-top: 8vh; text-align: center; color: var(--muted); }
  .start .box { border: 2px dashed var(--line); border-radius: 16px; padding: 40px 16px; }
  .start button { margin: 8px 4px; font-size: 15px; padding: 6px 16px; }
  .start .note { font-size: 13px; margin-top: 16px; }
  body.dragging .start .box { border-color: var(--accent); }

  /* 소스 보기: 자기 영역 안에서 스크롤, 줄 번호는 왼쪽에 고정 */
  .code { position: sticky; top: var(--hdr, 49px); height: calc(100vh - var(--hdr, 49px)); overflow: auto; font: 13.5px/1.6 var(--mono); }
  .code .lines { display: inline-block; min-width: 100%; padding: 8px 0 40px; }
  .code .r { display: flex; }
  .code .no {
    flex: none; position: sticky; left: 0; width: var(--no-w, 5ch); padding: 0 12px 0 8px; text-align: right;
    color: var(--muted); background: var(--bg); border-right: 1px solid var(--line); cursor: pointer; user-select: none;
  }
  .code .no::before { content: attr(data-n); } /* 글자가 아니므로 복사되지 않음 */
  .code .no:hover { color: var(--fg); }
  .code .tx { flex: 1; white-space: pre; padding: 0 24px 0 14px; tab-size: 4; -moz-tab-size: 4; }
  .code .r.hl .tx, .code .r.hl .no { background: var(--sel); color: var(--fg); }
  .code .msg { padding: 24px; color: var(--muted); font-family: var(--font); }
  .k { color: var(--hk); } .t { color: var(--ht); } .s { color: var(--hs); } .c { color: var(--hc); font-style: italic; }
  .n { color: var(--hn); } .p { color: var(--hp); } .f { color: var(--hf); }
  /* 오류: 빨간 글자 + 물결 밑줄 (색만으로 구분하지 않게), 줄 번호도 빨강 */
  .e { color: var(--err); text-decoration: underline wavy var(--err); text-underline-offset: 3px; text-decoration-skip-ink: none; cursor: help; }
  .x { color: var(--err); font-weight: 600; }
  .code .r.bad .no { color: var(--err); font-weight: 700; }
  /* 줄 아래 진단: 줄 번호 없음, 선택·복사 안 됨 */
  .code .r.dg { user-select: none; background: color-mix(in srgb, var(--err) 7%, transparent); }
  .code .r.dg .no { cursor: default; }
  .code .r.dg [data-t]::before { content: attr(data-t); }
  .code .r.dg .pad { color: transparent; }
  .code .r.dg .dm { color: var(--err); }
  .code .r.dg .dh { color: var(--muted); }

  @media (max-width: 760px) {
    .wrap { display: block; }
    nav { position: static; width: auto; max-height: 40vh; min-height: 0; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
    #navSize { display: none; }
    article, .start { padding: 16px 16px 60px; }
    .code { position: static; height: auto; }
  }

  /* 마크다운 본문 */
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { line-height: 1.35; margin: 1.6em 0 0.6em; font-weight: 650; scroll-margin-top: 60px; }
  .md h1 { font-size: 1.75em; } .md h2 { font-size: 1.4em; } .md h3 { font-size: 1.15em; } .md h4 { font-size: 1em; }
  :root[data-hrule] .md h1, :root[data-hrule] .md h2 { border-bottom: 1px solid var(--line); padding-bottom: 0.3em; }
  .md > :first-child { margin-top: 0; }
  .md p { margin: 0.7em 0; }
  .md ul, .md ol { margin: 0.5em 0; padding-left: 1.6em; }
  .md li { margin: 0.25em 0; }
  .md li > ul, .md li > ol { margin: 0.2em 0; }
  .md a { color: var(--link); text-decoration: none; cursor: pointer; }
  .md a:hover { text-decoration: underline; }
  .md img { max-width: 100%; }
  .md code {
    font: 0.88em/1.5 var(--mono);
    color: var(--code-fg); background: var(--panel); border: 1px solid var(--line);
    border-radius: 5px; padding: 0.1em 0.35em;
  }
  .md td code, .md th code { white-space: nowrap; }
  .md pre { line-height: 1.45; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; overflow-x: auto; margin: 1em 0; }
  .md pre code { color: var(--fg); background: none; border: 0; padding: 0; font-size: 0.86em; white-space: pre; tab-size: 4; }
  .md table { border-collapse: collapse; margin: 1em 0; display: block; overflow-x: auto; max-width: 100%; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; vertical-align: top; }
  .md th { background: var(--th); font-weight: 600; }
  .md blockquote { margin: 1em 0; padding: 0 1em; border-left: 3px solid var(--line); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
</style>
</head>
<body>
<header>
  <span class="name" id="name">Source Viewer</span>
  <span class="state" id="state"></span>
  <button id="mdMode" hidden></button>
  <button id="diagBtn" hidden></button>
  <span id="langs"></span>
  <select id="theme"></select>
  <button id="folder" hidden></button>
</header>
<div class="wrap">
  <nav id="nav" hidden></nav>
  <div id="navSize" hidden></div>
  <main>
    <div class="start" id="start">
      <div class="box">
        <p id="startMsg"></p>
        <p>
          <button id="pick" hidden></button>
          <button id="regrant" hidden></button>
          <button id="pickFiles" hidden></button>
        </p>
        <p class="note" id="startNote"></p>
      </div>
    </div>
    <article class="md" id="out" hidden></article>
    <div class="code" id="code" hidden></div>
  </main>
</div>
<input type="file" id="dirInput" webkitdirectory multiple hidden>
<script>
"use strict";
// ======================= 화면 문자열 =======================
const UI = {
  ko: {
    pick: "소스 폴더 선택", regrant: "폴더 열기", pickFiles: "폴더 선택",
    startNew: "이 파일(source-viewer.html)이 있는 폴더를 한 번만 골라 주세요.<br>다음부터는 목록에서 클릭만으로 파일을 봅니다.",
    startRegrant: "\"{0}\" 폴더를 읽으려면 한 번 허용해 주세요.",
    noteFsa: "Chrome에서 \"방문할 때마다 허용\"을 고르면 다음부터 이 단계 없이 바로 열립니다.",
    noteFallback: "이 브라우저는 폴더 자동 새로 고침을 지원하지 않습니다. (Chrome·Edge 권장)",
    noFiles: "고른 폴더에 볼 수 있는 소스 파일이 없습니다.", auto: "자동 새로 고침", noAuto: "자동 새로 고침 없음",
    notFound: "없는 파일: {0}", notFile: "\"{0}\"는 이 폴더의 소스 파일이 아니라 열 수 없습니다",
    binary: "글자 파일이 아니라 보여 줄 수 없습니다.", tooBig: "파일이 커서 색칠 없이 보여 줍니다.",
    lines: "{0}줄",
    folder: "폴더 바꾸기", folderTip: "다른 소스 폴더를 고릅니다",
    raw: "원문 보기", rawTip: "마크다운 원문을 줄 번호와 함께 봅니다",
    diagOff: "오류 설명 끄기", diagOn: "오류 설명 켜기", diagTip: "오류 줄 아래의 오류 코드·설명·추천(help)을 보이거나 숨깁니다. 빨간 밑줄은 늘 보입니다.",
    doc: "문서 보기", docTip: "마크다운을 문서 모양으로 봅니다",
    langTip: "문서(.md)를 이 언어로 봅니다",
    noTip: "클릭: 이 줄 표시 (주소에 줄 번호가 남아 다음에 바로 열림)",
    navSizeTip: "끌어서 폭 조절 / 두 번 클릭하면 이름에 맞춤",
    dirTip: "클릭: 폴더 접기 / 펼치기",
    theme: "테마 (글자·문법 색)", light: "밝은 테마", dark: "어두운 테마",
    uiKind: "알 수 없는 요소 종류 '{0}'", uiAttr: "알 수 없는 속성 '{0}'",
    uiResChar: "예약 문자 '{0}'는 따옴표 밖에서 쓸 수 없습니다", uiUpper: "'{0}'에 대문자를 쓸 수 없습니다",
    uiResWord: "'{0}'는 예약 단어라 이름으로 쓸 수 없습니다",
    uiDidYouMean: "'{0}'이(가) 맞나요?", uiSupports: "이 뷰어는 UI 문서 {0}까지 압니다",
    uiQuick: "(뷰어의 간단 검사입니다. 전체 검사는 ui-check)",
    uiErrs: "오류 {0}개", uiErrsTip: "모르는 요소 종류(E002)·속성(E003), 예약 문자·대문자·예약 단어(E013)만 검사합니다. 전체 검사는 ui-check로 하세요.",
  },
  en: {
    pick: "Choose source folder", regrant: "Open folder", pickFiles: "Choose folder",
    startNew: "Choose the folder that contains this file (source-viewer.html) once.<br>After that, just click a file in the list.",
    startRegrant: "Allow access to the \"{0}\" folder once.",
    noteFsa: "In Chrome, choose \"Allow on every visit\" to skip this step next time.",
    noteFallback: "This browser cannot auto-refresh a folder. (Chrome or Edge recommended)",
    noFiles: "No viewable source files in the chosen folder.", auto: "Auto refresh", noAuto: "No auto refresh",
    notFound: "Not found: {0}", notFile: "\"{0}\" is not a source file in this folder",
    binary: "This is not a text file.", tooBig: "Large file: shown without colors.",
    lines: "{0} lines",
    folder: "Change folder", folderTip: "Choose another source folder",
    raw: "Raw", rawTip: "Show the markdown source with line numbers",
    diagOff: "Hide details", diagOn: "Show details", diagTip: "Show or hide the error code, message and suggestion (help) under each error line. Red underlines always stay.",
    doc: "Document", docTip: "Show the markdown as a document",
    langTip: "Show documents (.md) in this language",
    noTip: "Click: mark this line (the line number stays in the address)",
    navSizeTip: "Drag to resize / double-click to fit",
    dirTip: "Click: collapse / expand the folder",
    theme: "Theme (text and syntax colors)", light: "Light themes", dark: "Dark themes",
    uiKind: "unknown element kind '{0}'", uiAttr: "unknown attribute '{0}'",
    uiResChar: "reserved character '{0}' outside quotes", uiUpper: "uppercase letters are not allowed in '{0}'",
    uiResWord: "'{0}' is a reserved word and cannot be a name",
    uiDidYouMean: "did you mean '{0}'?", uiSupports: "this viewer supports UI {0}",
    uiQuick: "(quick check by the viewer; run ui-check for the full check)",
    uiErrs: "{0} error(s)", uiErrsTip: "Checks only unknown element kinds (E002), unknown attributes (E003), and reserved characters, uppercase and reserved words (E013). Run ui-check for the full check.",
  },
};
const LANG_NAMES = { ko: "한국어", en: "English", ja: "日本語", zh: "中文" };
let uiLang = (navigator.language || "en").toLowerCase().startsWith("ko") ? "ko" : "en";
const t = (key, ...a) => String((UI[uiLang] || UI.en)[key] ?? UI.en[key]).replace(/\{(\d)\}/g, (_, i) => a[+i] ?? "");
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

// ======================= 파일 종류 =======================
// 언어: cpp, rust, toml, json, bat, hash(# 주석: 셸·PowerShell·YAML·Makefile·.gitignore), md, plain
const LANG_BY_EXT = {
  cpp: "cpp", cc: "cpp", cxx: "cpp", c: "cpp", h: "cpp", hh: "cpp", hpp: "cpp", hxx: "cpp", ipp: "cpp", inl: "cpp",
  ixx: "cpp", cppm: "cpp", mpp: "cpp", ccm: "cpp", cxxm: "cpp", rc: "cpp",
  rs: "rust", toml: "toml", ini: "toml", cfg: "toml", editorconfig: "toml",
  json: "json", jsonc: "json", bat: "bat", cmd: "bat",
  sh: "hash", ps1: "hash", psm1: "hash", yml: "hash", yaml: "hash", cmake: "hash", mk: "hash",
  gitignore: "hash", gitattributes: "hash",

  public register reinterpret_cast requires return sizeof static static_assert static_cast struct switch template this
  thread_local throw true try typedef typeid typename union using virtual volatile while`);

  BYTE WORD DWORD BOOL HWND HDC HINSTANCE HMODULE LPARAM WPARAM LRESULT UINT LPCWSTR LPWSTR WCHAR`);
const RS_KW = words(`as async await break const continue crate dyn else enum extern false fn for if impl in let loop

// 규칙 = (글, 위치, push) → 새 위치 (맞지 않으면 -1)
const re = (rx, cls) => (s, p, push) => {

/// 이름 분류: 키워드 → 타입 → 대문자 상수 → 대문자로 시작(타입) → 매크로(name!) → 함수(name()

  const w = m[0], key = lower ? w.toLowerCase() : w;

  while (i < s.length) {
    if (s[i] === "/" && s[i + 1] === "*") { d++; i += 2; }
    else if (s[i] === "*" && s[i + 1] === "/") { d--; i += 2; if (!d) break; }

}

  for (; i < s.length; i++) {

const RULES = {

const LANG_ALIAS = { "c++": "cpp", c: "cpp", h: "cpp", hpp: "cpp", cxx: "cpp", cc: "cpp", cppm: "cpp", ixx: "cpp",

/// 글 → [[클래스, 글], ...]
function highlight(src, lang) {
  if (lang === "ui") return highlightUi(src);
  const rules = RULES[LANG_ALIAS[lang] || lang];
  if (!rules) return [[null, src]];
  const out = [];
  let plain = "";
  const push = (cls, text) => {
    if (!text) return;
    if (!cls) { plain += text; return; }
    if (plain) { out.push([null, plain]); plain = ""; }
    out.push([cls, text]);
  };
  let pos = 0;
  outer: while (pos < src.length) {
    for (const r of rules) {
      const n = r(src, pos, push);
      if (n > pos) { pos = n; continue outer; }
    }
    // 아무 규칙도 맞지 않으면 이름이 아닌 글자를 한꺼번에 넘긴다
    const rx = /[^\w"'#/$%!@:;\[\-\.]+|[\s\S]/y; rx.lastIndex = pos;
    const m = rx.exec(src)[0];
    push(null, m); pos += m.length;
  }
  if (plain) out.push([null, plain]);
  return out;
}

// ---------- .ui (UI 레이아웃 형식 1, ui-guideline 문서 0.7) ----------
// 색칠 + 간단 검사만: E002 모르는 요소 종류, E003 모르는 속성, E013 예약 문자·대문자·예약 단어.
// 나머지 검사(E001, E004~E012, E014~E016, W1xx)는 ui-check가 한다.
const UI_DOC_VERSION = "0.7";
const UI_KINDS = words("label button edit number dropdown check canvas spacer group row column menu item separator defaults");
const UI_ATTRS = words(`left top right bottom width height right_of below gap hidden disabled text align hint max_length
  min max step hex menu checked padding check radio tip disabled_tip section`);
const UI_RESERVED = new Set([...UI_KINDS, ...words("include style true false if else use ref")]);
const UI_NO_NAME = words("spacer separator");
const UI_RES_CHARS = ".$@%:;[](),+*/\\!?&|<>~^'#";

/// 거리: 넣기·빼기·바꾸기·이웃한 두 글자 맞바꾸기 = 1 (Damerau–Levenshtein, 이웃 맞바꾸기만)
function editDistance(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 0; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length];
}
/// 추천: 거리 2 이하, 틀린 단어 길이보다 작고, 가장 가까운 후보가 하나뿐일 때만
function suggest(word, cands) {
  let best = 3, hit = null, n = 0;
  for (const c of cands) {
    const x = editDistance(word, c);
    if (x < best) { best = x; hit = c; n = 1; } else if (x === best) n++;
  }
  return best <= 2 && best < word.length && n === 1 ? hit : null;
}

function highlightUi(src) {
  const out = [];
  out.diags = [];          // 진단: { ln 줄(0부터), prefix 줄 앞부분, len 범위(코드 포인트), code, msg, help }
  let ln = 0, line = "", ts = 0;   // 지금 줄, 지금 토큰의 시작 위치
  const push = (cls, text, tip) => { if (text) out.push([cls, text, tip]); };
  const err = (code, text, msgKey, help) => {
    const msg = t(msgKey, text);
    out.diags.push({ ln, prefix: line.slice(0, ts), len: [...text].length, code, msg, help });
    push("e", text, `error[${code}]: ${msg}` + (help ? `\nhelp: ${help}` : "") + "\n" + t("uiQuick"));
  };
  const upper = (text) => err("E013", text, "uiUpper", t("uiDidYouMean", text.toLowerCase()));
  // 종류 단어: 알면 k, 모르면 E002 (+추천)
  const kindWord = w => {
    if (/[A-Z]/.test(w)) return upper(w);
    if (UI_KINDS.has(w)) return push("k", w);
    const s = suggest(w, UI_KINDS);
    err("E002", w, "uiKind", s ? t("uiDidYouMean", s) : t("uiSupports", UI_DOC_VERSION));
  };
  const lex = /[ \t]+|\/\/.*|"(?:\\.|[^"\\])*"?|-?[A-Za-z0-9_]+|[\s\S]/y;
  src.split("\n").forEach((l, n) => {
    ln = n; line = l;
    if (ln) push(null, "\n");
    let i = 0, state = "kind";
    if (ln === 0 && /^\uFEFF?#ui(?![A-Za-z0-9_])/.test(line)) {   // 머리 줄
      const h = line.match(/^\uFEFF?#ui/)[0];
      push("k", h); i = h.length; state = "version";
    }
    while (i < line.length) {
      lex.lastIndex = i;
      const tok = lex.exec(line)[0];
      const before = line[i - 1], after = line[i + tok.length];
      ts = i;
      i += tok.length;
      if (/^[ \t]/.test(tok)) { push(null, tok); continue; }
      if (tok.startsWith("//")) { push("c", tok); continue; }
      if (tok[0] === '"') { push("s", tok); continue; }
      if (!/^-?[A-Za-z0-9_]+$/.test(tok)) {         // 글자 하나
        if (UI_RES_CHARS.includes(tok)) err("E013", tok, "uiResChar");
        else push(null, tok);
        continue;
      }
      if (state === "version") { push("n", tok); state = "attr"; continue; }
      if (before === "=") {                          // 값: 숫자 또는 단어
        if (/^-?\d/.test(tok)) push("n", tok);
        else if (/[A-Z]/.test(tok)) upper(tok);
        else push("p", tok);
        continue;
      }
      if (state === "kind") { kindWord(tok); state = tok === "defaults" ? "dkind" : UI_NO_NAME.has(tok) ? "attr" : "name"; continue; }
      if (state === "dkind") { kindWord(tok); state = "attr"; continue; }
      if (state === "name" && after !== "=") {       // 요소 이름
        state = "attr";
        if (/[A-Z]/.test(tok)) upper(tok);
        else if (UI_RESERVED.has(tok)) err("E013", tok, "uiResWord");
        else push("f", tok);
        continue;
      }
      state = "attr";                                // 속성 이름 (값 있음/없음)
      if (/^-?\d/.test(tok)) { push("n", tok); continue; }   // 'left = 50'의 50 (E004는 ui-check가)
      if (/[A-Z]/.test(tok)) { upper(tok); continue; }
      if (UI_ATTRS.has(tok)) { push("t", tok); continue; }
      const s = suggest(tok, UI_ATTRS);
      err("E003", tok, "uiAttr", s ? t("uiDidYouMean", s) : t("uiSupports", UI_DOC_VERSION));
    }
  });
  return out;
}

/// 토큰 → 줄별 HTML (여러 줄 주석·문자열도 줄마다 나눔). lines.bad = 오류(e)가 있는 줄 번호(0부터)
function tokensToLines(tokens) {
  const lines = [];
  lines.bad = new Set();
  lines.errors = 0;
  let cur = "";
  for (const [cls, s, tip] of tokens) {
    if (cls === "e") lines.errors++;
    const parts = s.split("\n");
    parts.forEach((part, k) => {
      if (k) { lines.push(cur); cur = ""; }
      if (!part) return;
      if (cls === "e") lines.bad.add(lines.length);
      cur += cls ? `<span class="${cls}"${tip ? ` title="${esc(tip)}"` : ""}>${esc(part)}</span>` : esc(part);
    });
  }
  lines.push(cur);
  return lines;
}

// ======================= 마크다운 → HTML (docs-viewer와 같은 변환기) =======================
function inline(text) {
  const keep = [];
  const stash = html => "\u0000" + (keep.push(html) - 1) + "\u0000";
  text = text.replace(/(`+)([^`]|[^`][\s\S]*?[^`])\1(?!`)/g, (_, q, c) => stash("<code>" + esc(c.replace(/^ (.*) $/, "$1")) + "</code>"));
  text = esc(text);
  text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, a, u) => stash(`<img alt="${a}" data-src="${u}">`));
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, s, u) => stash(`<a data-href="${u}">${s}</a>`));
  text = text.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (_, p, u) => p + stash(`<a data-href="${u}">${u}</a>`));
  text = text.replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/(^|[^\w*])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>");
  text = text.replace(/ {2,}$/gm, "<br>");
  for (let n = 0; n < 3 && text.includes("\u0000"); n++) text = text.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
  return text;
}

const reHead = /^(#{1,6})\s+(.*?)\s*#*\s*$/;
const reFence = /^\s*(```|~~~)(.*)$/;
const reHr = /^\s*([-*_])(\s*\1){2,}\s*$/;
const reItem = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const reTableSep = /^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)*\|?\s*$/;
const indentOf = s => s.match(/^\s*/)[0].replace(/\t/g, "    ").length;

function slug(text, used) {
  let s = text.replace(/<[^>]+>/g, "").replace(/&[a-z]+;/g, "").toLowerCase().trim()
    .replace(/[^\p{L}\p{N}\s_-]/gu, "").replace(/\s/g, "-");
  let id = s, n = 1;
  while (used.has(id)) id = s + "-" + n++;
  used.add(id);
  return id;
}

function splitRow(line) {
  let s = line.trim();
  if (s.startsWith("|")) s = s.slice(1);
  if (s.endsWith("|") && !s.endsWith("\\|")) s = s.slice(0, -1);
  const cells = []; let cur = "", inCode = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === "`") inCode = !inCode;
    if (ch === "\\" && s[i + 1] === "|") { cur += "|"; i++; continue; }
    if (ch === "|" && !inCode) { cells.push(cur.trim()); cur = ""; continue; }
    cur += ch;
  }
  cells.push(cur.trim());
  return cells;
}

function dedent(lines) {
  const ind = Math.min(...lines.filter(l => l.trim()).map(indentOf));
  return lines.map(l => l.replace(/\t/g, "    ").slice(Number.isFinite(ind) ? ind : 0));
}

function renderBlocks(lines, used) {
  let html = "", i = 0;
  const startsBlock = l => reHead.test(l) || reFence.test(l) || reHr.test(l) || reItem.test(l) || /^\s*>/.test(l);
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    let m;
    if ((m = line.match(reFence))) {            // 코드 블록 (언어가 있으면 색칠)
      const fence = m[1], lang = m[2].trim().toLowerCase(), body = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence)) body.push(lines[i++]);
      i++;
      const code = dedent(body).join("\n");
      const hl = (!lang || lang === "text") && /^#ui[ \t]/.test(code) ? "ui" : lang;   // ```ui 또는 #ui로 시작하는 블록
      const inner = hl ? tokensToLines(highlight(code, hl)).join("\n") : esc(code);
      html += `<pre><code${lang ? ` class="lang-${esc(lang)}"` : ""}>${inner}</code></pre>`;
      continue;
    }
    if ((m = line.match(reHead))) {
      const n = m[1].length, h = inline(m[2]);
      html += `<h${n} id="${slug(h, used)}">${h}</h${n}>`; i++; continue;
    }
    if (reHr.test(line) && !reItem.test(line)) { html += "<hr>"; i++; continue; }
    if (line.includes("|") && i + 1 < lines.length && reTableSep.test(lines[i + 1])) {
      const head = splitRow(line);
      const aligns = splitRow(lines[i + 1]).map(c => c.startsWith(":") && c.endsWith(":") ? "center" : c.endsWith(":") ? "right" : "");
      const al = k => aligns[k] ? ` style="text-align:${aligns[k]}"` : "";
      i += 2;
      let tb = "<table><thead><tr>" + head.map((c, k) => `<th${al(k)}>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
        const row = splitRow(lines[i++]);
        tb += "<tr>" + head.map((_, k) => `<td${al(k)}>${inline(row[k] ?? "")}</td>`).join("") + "</tr>";
      }
      html += tb + "</tbody></table>"; continue;
    }
    if (/^\s*>/.test(line)) {
      const body = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*> ?/, ""));
      html += `<blockquote>${renderBlocks(body, used)}</blockquote>`; continue;
    }
    if (reItem.test(line)) {
      const r = renderList(lines, i, used); html += r.html; i = r.next; continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !(para.length && startsBlock(lines[i]))
           && !(lines[i].includes("|") && i + 1 < lines.length && reTableSep.test(lines[i + 1]))) {
      para.push(lines[i++].trim() + (/ {2,}$/.test(lines[i - 1]) ? "  " : ""));
    }
    html += `<p>${inline(para.join("\n"))}</p>`;
  }
  return html;
}

function renderList(lines, i, used) {
  const first = lines[i].match(reItem);
  const base = indentOf(first[1]);
  const ordered = /\d/.test(first[2]);
  const start = ordered ? parseInt(first[2], 10) : 1;
  let html = ordered ? `<ol${start !== 1 ? ` start="${start}"` : ""}>` : "<ul>";
  while (i < lines.length) {
    const m = lines[i].match(reItem);
    if (!m || indentOf(m[1]) !== base || /\d/.test(m[2]) !== ordered) break;
    const text = [m[3]], child = [];
    i++;
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) {
        let j = i + 1; while (j < lines.length && !lines[j].trim()) j++;
        if (j < lines.length && indentOf(lines[j]) > base) { child.push(""); i++; continue; }
        break;
      }
      if (indentOf(l) <= base) break;
      if (!child.length && !reItem.test(l) && !reFence.test(l) && !reTableSep.test(lines[i + 1] || "")) {
        text.push(l.trim()); i++; continue;
      }
      child.push(l); i++;
    }
    html += `<li>${inline(text.join("\n"))}${child.length ? renderBlocks(dedent(child), used) : ""}</li>`;
  }
  return { html: html + (ordered ? "</ol>" : "</ul>"), next: i };
}

const renderMarkdown = text => renderBlocks(text.split("\n"), new Set());

// ======================= 소스 폴더 (두 가지 방식) =======================
// 1) FSA: 폴더 핸들 (Chrome·Edge) → 자동 새로 고침, 다음 실행 때 다시 씀
// 2) files: <input webkitdirectory>로 고른 파일 목록 (다른 브라우저) → 그 순간의 내용만
const SKIP_DIRS = new Set(["obj", "gcm.cache", ".git", "target", "node_modules", "bin", "build", "Claude outputs"]);
const MAX_DEPTH = 4;
const HL_MAX = 1.5 * 1024 * 1024;    // 이보다 큰 파일은 색칠하지 않음
let src = null;          // { kind, name, list() → [path], get(path) → File }
let fileSet = new Set(); // 목록에 있는 모든 경로
let entries = new Map(); // 목록 키 → { md: { lang: path } } 또는 { path }
let cur = null;          // 지금 보는 파일 경로
let curMod = 0;          // 지금 파일의 수정 시각 (자동 새로 고침)
let docLang = uiLang;    // 고른 문서 언어
let mdRaw = false;       // .md를 원문으로 볼지
let hlLine = 0;          // 표시한 줄
const $ = id => document.getElementById(id);
const KEY = location.pathname; // file:// 페이지는 저장소를 함께 쓰므로 이 파일 경로로 구분
try { mdRaw = localStorage.getItem("sv-md-raw:" + KEY) === "1"; } catch (e) {}
let showDiag = true;     // .ui 오류를 줄 아래에 보일지
try { showDiag = localStorage.getItem("sv-diag:" + KEY) !== "0"; } catch (e) {}

async function scanHandle(dir, prefix = "", depth = 0, out = []) {
  for await (const [name, h] of dir.entries()) {
    if (h.kind === "directory") {
      if (depth < MAX_DEPTH && !SKIP_DIRS.has(name) && !name.startsWith(".")) await scanHandle(h, prefix + name + "/", depth + 1, out);
    } else if (langOf(name)) out.push(prefix + name);
  }
  return out;
}

async function getHandleFile(dir, path) {
  const parts = path.split("/");
  for (let k = 0; k < parts.length - 1; k++) dir = await dir.getDirectoryHandle(parts[k]);
  return (await dir.getFileHandle(parts[parts.length - 1])).getFile();
}

function useHandle(dir) {
  src = { kind: "fsa", name: dir.name, list: () => scanHandle(dir), get: p => getHandleFile(dir, p) };
}

function useFiles(fileList) {
  const map = new Map();
  let root = "";
  for (const f of fileList) {
    const rel = f.webkitRelativePath || f.name;
    const parts = rel.split("/");
    if (parts.length > 1) { root = parts[0]; parts.shift(); }
    const dirs = parts.slice(0, -1);
    if (dirs.some(d => SKIP_DIRS.has(d) || d.startsWith(".")) || dirs.length > MAX_DEPTH) continue;
    if (langOf(rel)) map.set(parts.join("/"), f);
  }
  src = { kind: "files", name: root || "files",
          list: async () => [...map.keys()],
          get: async p => { const f = map.get(p); if (!f) throw new Error("not found"); return f; } };
}

// 이름.ko.md → { base: 이름, lang: ko },  이름.md → { base: 이름, lang: en }
function splitLang(path) {
  const m = path.match(/^(.*?)(?:\.([a-z]{2}(?:-[a-z]{2})?))?\.md$/i);
  return m ? { base: m[1], lang: (m[2] || "en").toLowerCase() } : { base: path, lang: "" };
}
const keyOf = p => isMd(p) ? splitLang(p).base + ".md" : p;

async function refreshList() {
  const paths = (await src.list()).sort();
  fileSet = new Set(paths);
  entries = new Map();
  for (const p of paths) {
    const key = keyOf(p);
    if (isMd(p)) {
      if (!entries.has(key)) entries.set(key, { md: {} });
      entries.get(key).md[splitLang(p).lang] = p;
    } else entries.set(key, { path: p });
  }
  drawNav(); drawLangs();
  return paths.length;
}

// README, CHANGELOG를 먼저, 그다음 폴더 없는 파일, 폴더별 파일
function orderedKeys() {
  const rank = k => /^readme\.md$/i.test(k) ? 0 : /^changelog\.md$/i.test(k) ? 1 : k.includes("/") ? 3 : 2;
  const dir = k => k.slice(0, k.lastIndexOf("/") + 1);
  return [...entries.keys()].sort((a, b) => rank(a) - rank(b) || dir(a).localeCompare(dir(b)) || a.localeCompare(b));
}

function pathFor(key, lang) {
  const e = entries.get(key);
  if (!e) return null;
  if (!e.md) return e.path;
  return e.md[lang] || e.md.en || Object.values(e.md)[0];
}

// ---------- 트리 목록 (폴더 접기·펼치기, 접은 폴더는 브라우저에 기억) ----------
// 각 폴더 안의 순서: README·CHANGELOG → 하위 폴더 → 그 밖의 파일 (이름순)
let closed = new Set();  // 접은 폴더 경로 ("src/", "src/ui/")
try { closed = new Set(JSON.parse(localStorage.getItem("sv-closed:" + KEY) || "[]")); } catch (e) {}
function saveClosed() { try { localStorage.setItem("sv-closed:" + KEY, JSON.stringify([...closed])); } catch (e) {} }
/// 이 파일이 들어 있는 폴더를 모두 펼침
function expandTo(path) {
  const parts = path.split("/");
  let changed = false;
  for (let k = 1; k < parts.length; k++) if (closed.delete(parts.slice(0, k).join("/") + "/")) changed = true;
  if (changed) saveClosed();
}

function buildTree() {
  const root = { dirs: new Map(), files: [] };
  for (const key of entries.keys()) {
    const parts = key.split("/");
    let n = root;
    for (let k = 0; k < parts.length - 1; k++) {
      if (!n.dirs.has(parts[k])) n.dirs.set(parts[k], { dirs: new Map(), files: [] });
      n = n.dirs.get(parts[k]);
    }
    n.files.push(key);
  }
  return root;
}

const ICON_CHEVRON = '<svg class="tw" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_FOLDER = '<svg class="fi" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 3.25h4.1l1.5 1.6h6.9v8.4H1.75z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';

/// 줄 앞에 연결선 칸을 붙임 (칸: "" 빈칸, v │, t ├, l └)
function guides(el, list, isFile) {
  list.forEach((c, k) => {
    if (!c) return;
    const s = document.createElement("span");
    s.className = "g " + c + (isFile ? " f" : "");
    s.style.setProperty("--k", k);
    el.prepend(s);
  });
}

function drawNav() {
  const nav = $("nav");
  const top = nav.scrollTop;
  nav.innerHTML = "";
  const fileRank = k => { const n = k.slice(k.lastIndexOf("/") + 1); return /^readme\.md$/i.test(n) ? 0 : /^changelog\.md$/i.test(n) ? 1 : 2; };
  const fileRow = (key, depth) => {
    const p = pathFor(key, docLang);
    const a = document.createElement("a");
    a.style.setProperty("--d", depth);
    const dot = document.createElement("span");
    dot.className = "dot " + langOf(p);
    a.append(dot, key.slice(key.lastIndexOf("/") + 1));
    if (isMd(p)) {
      const lang = splitLang(p).lang;
      if (lang !== docLang) { const s = document.createElement("span"); s.className = "alt"; s.textContent = lang; a.append(s); }
    }
    a.title = p;
    if (p === cur) a.className = "cur";
    a.onclick = () => openFile(p);
    nav.append(a);
  };
  const walk = (node, prefix, depth, trail) => {
    const files = node.files.sort((a, b) => fileRank(a) - fileRank(b) || a.localeCompare(b));
    const kids = [...files.filter(f => fileRank(f) < 2).map(f => ({ f })),
                  ...[...node.dirs].sort((a, b) => a[0].localeCompare(b[0])).map(([name, sub]) => ({ name, sub })),
                  ...files.filter(f => fileRank(f) === 2).map(f => ({ f }))];
    kids.forEach((kid, i) => {
      const last = i === kids.length - 1;
      // 연결선: 위 칸들은 그 조상 폴더 뒤에 형제가 있으면 │, 마지막 칸은 ├ (마지막 항목이면 └)
      const g = depth ? [...trail.map(l => l ? "" : "v"), last ? "l" : "t"] : [];
      if (kid.f) { fileRow(kid.f, depth); guides(nav.lastChild, g, true); return; }
      const path = prefix + kid.name + "/";
      const open = !closed.has(path);
      const d = document.createElement("div");
      d.className = "dir" + (open ? " open" : "") + (!open && cur && cur.startsWith(path) ? " has-cur" : "");
      d.style.setProperty("--d", depth);
      d.innerHTML = ICON_CHEVRON + ICON_FOLDER;
      d.append(kid.name);
      d.title = path + "\n" + t("dirTip");
      d.onclick = () => { if (open) closed.add(path); else closed.delete(path); saveClosed(); drawNav(); };
      nav.append(d);
      guides(d, g, false);
      if (open) walk(kid.sub, path, depth + 1, depth ? [...trail, last] : []);
    });
  };
  walk(buildTree(), "", 0, []);
  nav.hidden = false;
  $("navSize").hidden = false;
  nav.scrollTop = top;
  if (!navWidthSaved) fitNav();
}

// ---------- 목록 폭 (끌어서 조절, 두 번 클릭 = 이름에 맞춤, 브라우저에 기억) ----------
let navWidthSaved = false;
function setNavWidth(px, save) {
  const w = Math.round(Math.min(Math.max(px, 140), innerWidth * 0.6));
  document.body.style.setProperty("--nav-w", w + "px"); // <html>의 style은 테마가 바꾸므로 body에
  if (save) { navWidthSaved = true; try { localStorage.setItem("sv-nav-w:" + KEY, String(w)); } catch (e) {} }
}
function fitNav() {
  let max = 0;
  for (const a of $("nav").querySelectorAll("a, .dir")) {
    a.style.width = "max-content";
    max = Math.max(max, a.getBoundingClientRect().width);
    a.style.width = "";
  }
  const nav = $("nav"), cs = getComputedStyle(nav);
  const extra = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + parseFloat(cs.borderRightWidth)
              + (nav.offsetWidth - nav.clientWidth - parseFloat(cs.borderRightWidth));
  if (max) setNavWidth(Math.ceil(max + extra + 2), false);
}
try { const w = +localStorage.getItem("sv-nav-w:" + KEY); if (w > 0) { navWidthSaved = true; setNavWidth(w, false); } } catch (e) {}
$("navSize").addEventListener("pointerdown", e => {
  e.preventDefault();
  const h = $("navSize"); h.setPointerCapture(e.pointerId);
  const left = $("nav").getBoundingClientRect().left;
  document.body.classList.add("resizing");
  const move = ev => setNavWidth(ev.clientX - left, false);
  const up = ev => {
    setNavWidth(ev.clientX - left, true);
    document.body.classList.remove("resizing");
    h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up);
  };
  h.addEventListener("pointermove", move); h.addEventListener("pointerup", up);
});
$("navSize").addEventListener("dblclick", () => {
  navWidthSaved = false;
  try { localStorage.removeItem("sv-nav-w:" + KEY); } catch (e) {}
  fitNav();
});

function drawLangs() {
  const all = new Set();
  for (const e of entries.values()) if (e.md) for (const l of Object.keys(e.md)) all.add(l);
  const box = $("langs");
  box.innerHTML = "";
  if (all.size < 2) return;
  for (const l of [...all].sort((a, b) => (a === "ko" ? -1 : b === "ko" ? 1 : a.localeCompare(b)))) {
    const b = document.createElement("button");
    b.textContent = LANG_NAMES[l] || l;
    b.title = t("langTip");
    b.className = l === docLang ? "on" : "";
    b.onclick = () => {
      docLang = l;
      if (UI[l]) uiLang = l;
      if (cur && isMd(cur)) openFile(pathFor(keyOf(cur), l));
      else { drawNav(); drawLangs(); drawStatic(); }
    };
    box.append(b);
  }
}

// a/b/c.md 기준으로 상대 경로 풀기
function resolve(fromPath, href) {
  const parts = fromPath.split("/"); parts.pop();
  for (const seg of href.split("/")) {
    if (seg === "" || seg === ".") continue;
    if (seg === "..") parts.pop(); else parts.push(seg);
  }
  return parts.join("/");
}

/// 파일 → 글. UTF-8이 아니면 EUC-KR(CP949), BOM이 있으면 UTF-16
async function readText(f) {
  const b = new Uint8Array(await f.arrayBuffer());
  let text, enc;
  if (b[0] === 0xFF && b[1] === 0xFE) { text = new TextDecoder("utf-16le").decode(b); enc = "UTF-16"; }
  else if (b[0] === 0xFE && b[1] === 0xFF) { text = new TextDecoder("utf-16be").decode(b); enc = "UTF-16"; }
  else {
    try { text = new TextDecoder("utf-8", { fatal: true }).decode(b); enc = "UTF-8"; }
    catch (e) { text = new TextDecoder("euc-kr").decode(b); enc = "EUC-KR"; }
  }
  return { text: text.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n"), enc, size: b.length };
}

const fmtSize = n => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB";

function setState(text, err = false) { $("state").textContent = text; $("state").className = "state" + (err ? " err" : ""); }

async function openFile(path, { hash = "", line = 0, keepScroll = false } = {}) {
  let f;
  try { f = await src.get(path); }
  catch (e) { setState(t("notFound", path), true); return; }
  const codeEl = $("code"), art = $("out");
  const prevY = !codeEl.hidden ? codeEl.scrollTop : scrollY;
  const { text, enc, size } = await readText(f);
  const changed = path !== cur;
  if (changed) expandTo(path);
  cur = path; curMod = f.lastModified;
  if (changed) hlLine = 0;
  if (line) hlLine = line;
  const lang = langOf(path);
  if (lang === "md") {
    docLang = splitLang(path).lang;
    if (UI[docLang]) uiLang = docLang;
    document.documentElement.lang = docLang;
  }
  const asDoc = lang === "md" && !mdRaw;
  let lineCount = 0, note = "", errors = 0;
  if (asDoc) {
    art.innerHTML = renderMarkdown(text);
    await loadImages();
    codeEl.hidden = true; art.hidden = false;
    lineCount = text.split("\n").length;
  } else {
    if (text.includes("\u0000") && enc !== "UTF-16") {
      codeEl.innerHTML = `<div class="msg">${esc(t("binary"))}</div>`;
    } else {
      const big = text.length > HL_MAX;
      if (big) note = t("tooBig");
      const toks = big || lang === "plain" ? [[null, text]] : highlight(text, lang);
      const lines = tokensToLines(toks);
      const diags = toks.diags || [];
      if (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();
      lineCount = lines.length; errors = lines.errors;
      codeEl.style.setProperty("--no-w", (String(lineCount).length + 3) + "ch");
      let html = '<div class="lines">';
      // 오류 줄 아래에 진단 끼워 넣기 (줄 번호 없음, 복사 안 됨)
      const byLine = new Map();
      if (showDiag) for (const d of diags) { if (!byLine.has(d.ln)) byLine.set(d.ln, []); byLine.get(d.ln).push(d); }
      lines.forEach((l, k) => {
        html += `<div class="r${k + 1 === hlLine ? " hl" : ""}${lines.bad.has(k) ? " bad" : ""}" id="L${k + 1}"><span class="no" data-n="${k + 1}"></span><span class="tx">${l}</span></div>`;
        for (const d of byLine.get(k) || []) html += diagRows(d);
      });
      codeEl.innerHTML = html + "</div>";
    }
    art.hidden = true; codeEl.hidden = false;
  }
  $("start").hidden = true;
  $("name").textContent = (src.name ? src.name + " / " : "") + path;
  document.title = path + " - Source Viewer";
  setState([lineCount ? t("lines", lineCount) : "", fmtSize(size), enc, src.kind === "fsa" ? t("auto") : t("noAuto"), note].filter(Boolean).join(" · "));
  if (errors) {   // .ui 간단 검사 결과
    const b = document.createElement("span");
    b.className = "bad"; b.textContent = " · " + t("uiErrs", errors); b.title = t("uiErrsTip");
    $("state").append(b);
  }
  drawNav(); drawLangs(); drawStatic();
  try { localStorage.setItem("sv-last:" + KEY, path); } catch (e) {}
  if (changed || line || hash) setHash(hash);
  if (asDoc) {
    if (hash) { const el = document.getElementById(decodeURIComponent(hash)); if (el) { el.scrollIntoView(); return; } }
    scrollTo(0, keepScroll ? prevY : 0);
  } else {
    scrollTo(0, 0);
    if (keepScroll) codeEl.scrollTop = prevY;
    else if (line) { const r = $("L" + line); if (r) r.scrollIntoView({ block: "center" }); }
    else codeEl.scrollTop = 0;
  }
}

/// 진단 2줄: "   ^^^^ error[E003]: 메시지" / "        help: 추천"
/// 앞부분은 원래 줄의 글자를 투명하게 그대로 써서, 탭·한글이 있어도 칸이 맞는다.
/// 글자는 모두 CSS ::before(data-t)로 그려서 선택·복사되지 않는다 (줄 번호와 같은 방식)
function diagRows(d) {
  const span = (cls, text) => `<span class="${cls}" data-t="${esc(text)}"></span>`;
  const pad = span("pad", d.prefix);
  const row = body => `<div class="r dg"><span class="no"></span><span class="tx">${body}</span></div>`;
  const w = Math.max(d.len, 1);
  let html = row(pad + span("x", "^".repeat(w) + " error[" + d.code + "]") + span("dm", ": " + d.msg));
  if (d.help) html += row(pad + span("dh", " ".repeat(w + 1) + "help: " + d.help));
  return html;
}

function setHash(anchor = "") {
  history.replaceState(null, "", "#" + encodeURI(cur) + (hlLine && !$("code").hidden ? ":L" + hlLine : anchor ? "#" + anchor : ""));
}

// 줄 번호 클릭 → 그 줄 표시 (주소에 남김)
$("code").addEventListener("click", e => {
  const no = e.target.closest(".no");
  if (!no) return;
  const n = +no.dataset.n;
  for (const r of $("code").querySelectorAll(".r.hl")) r.classList.remove("hl");
  if (hlLine === n) hlLine = 0;
  else { hlLine = n; no.parentElement.classList.add("hl"); }
  setHash();
});

async function loadImages() {
  for (const img of $("out").querySelectorAll("img[data-src]")) {
    const u = img.dataset.src;
    if (/^(https?:|data:)/.test(u)) { img.src = u; continue; }
    try { img.src = URL.createObjectURL(await src.get(resolve(cur, u))); } catch (e) {}
  }
}

// 문서 안 링크: 폴더 안 파일은 이 뷰어에서 (file.rs#L12 → 12번 줄), #은 제목으로, http는 새 탭
$("out").addEventListener("click", e => {
  const a = e.target.closest("a[data-href]");
  if (!a) return;
  e.preventDefault();
  const href = a.dataset.href;
  if (/^(https?:|mailto:)/i.test(href)) { open(href, "_blank", "noopener"); return; }
  if (href.startsWith("#")) { const el = document.getElementById(decodeURIComponent(href.slice(1))); if (el) el.scrollIntoView(); return; }
  const [p, h = ""] = href.split("#");
  const target = resolve(cur, decodeURI(p));
  if (!fileSet.has(target)) { setState(t("notFile", href), true); return; }
  const ln = h.match(/^L(\d+)$/);
  openFile(target, ln ? { line: +ln[1] } : { hash: h });
});

// 자동 새로 고침 (FSA만): 1초마다 지금 파일의 수정 시각 확인, 창으로 돌아올 때 목록 다시 읽기
setInterval(async () => {
  if (!src || src.kind !== "fsa" || !cur || document.hidden) return;
  try { const f = await src.get(cur); if (f.lastModified !== curMod) openFile(cur, { keepScroll: true }); } catch (e) {}
}, 1000);
addEventListener("focus", async () => { if (src && src.kind === "fsa") { try { await refreshList(); } catch (e) {} } });

// .md 문서 보기 ↔ 원문 보기
// .ui 오류 표시 켜기 ↔ 끄기 (밑줄과 풍선 도움말은 늘 있음)
$("diagBtn").onclick = () => {
  showDiag = !showDiag;
  try { localStorage.setItem("sv-diag:" + KEY, showDiag ? "1" : "0"); } catch (e) {}
  if (cur) openFile(cur, { keepScroll: true });
};

$("mdMode").onclick = () => {
  mdRaw = !mdRaw;
  try { localStorage.setItem("sv-md-raw:" + KEY, mdRaw ? "1" : "0"); } catch (e) {}
  if (cur) openFile(cur);
};

// ======================= 시작 =======================
/// 주소의 #경로, #경로:L12, #경로#제목 → { path, line, hash }
function savedTarget() {
  const raw = decodeURI(location.hash.slice(1));
  if (raw) {
    const [p, h = ""] = raw.split("#");
    const m = p.match(/^(.*):L(\d+)$/);
    return m ? { path: m[1], line: +m[2] } : { path: p, hash: h };
  }
  try { return { path: localStorage.getItem("sv-last:" + KEY) }; } catch (e) { return { path: null }; }
}

async function startWith(target) {
  const n = await refreshList();
  if (!n) { showStart("noFiles"); return; }
  $("folder").hidden = false;
  if (target && target.path && fileSet.has(target.path)) openFile(target.path, { line: target.line || 0, hash: target.hash || "" });
  else openFile(pathFor(orderedKeys()[0], docLang));
}

function db() {
  return new Promise((ok, no) => {
    const r = indexedDB.open("source-viewer", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  });
}
async function saveDir(h) {
  try { const d = await db(); d.transaction("kv", "readwrite").objectStore("kv").put(h, "dir:" + KEY); } catch (e) {}
}
async function loadDir() {
  try {
    const d = await db();
    return await new Promise(ok => { const r = d.transaction("kv").objectStore("kv").get("dir:" + KEY); r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null); });
  } catch (e) { return null; }
}

const hasFsa = !!window.showDirectoryPicker;
let savedDir = null;

function showStart(kind) {
  $("start").hidden = false; $("out").hidden = true; $("code").hidden = true;
  $("pick").hidden = !hasFsa; $("pickFiles").hidden = hasFsa;
  $("regrant").hidden = kind !== "regrant";
  $("startMsg").innerHTML = kind === "regrant" ? esc(t("startRegrant", savedDir.name)) : kind === "noFiles" ? esc(t("noFiles")) : t("startNew");
  $("startNote").textContent = hasFsa ? t("noteFsa") : t("noteFallback");
  drawStatic();
}

// 화면 언어에 따라 바뀌는 고정 글자
function drawStatic() {
  $("pick").textContent = t("pick"); $("regrant").textContent = t("regrant"); $("pickFiles").textContent = t("pickFiles");
  $("folder").textContent = t("folder"); $("folder").title = t("folderTip");
  $("navSize").title = t("navSizeTip");
  const md = cur && isMd(cur);
  $("mdMode").hidden = !md;
  const ui = cur && langOf(cur) === "ui";
  $("diagBtn").hidden = !ui;
  if (ui) { $("diagBtn").textContent = showDiag ? t("diagOff") : t("diagOn"); $("diagBtn").title = t("diagTip"); }
  if (md) { $("mdMode").textContent = mdRaw ? t("doc") : t("raw"); $("mdMode").title = mdRaw ? t("docTip") : t("rawTip"); }
  $("code").dataset.tip = t("noTip");
  drawThemes();
}
// 줄 번호 풍선 도움말: 마우스가 올라간 줄 번호에만 넣는다
$("code").addEventListener("mouseover", e => { const no = e.target.closest(".no"); if (no && !no.title) no.title = $("code").dataset.tip; });

async function pickFolder() {
  if (hasFsa) {
    try {
      const h = await showDirectoryPicker({ id: "source-viewer", mode: "read" });
      savedDir = h; useHandle(h); await saveDir(h); await startWith(savedTarget());
    } catch (e) {}
  } else {
    $("dirInput").click();
  }
}
$("pick").onclick = pickFolder;
$("pickFiles").onclick = pickFolder;
$("folder").onclick = pickFolder;
$("dirInput").onchange = async () => { if ($("dirInput").files.length) { useFiles($("dirInput").files); await startWith(savedTarget()); } };
$("regrant").onclick = async () => {
  try {
    if ((await savedDir.requestPermission({ mode: "read" })) === "granted") { useHandle(savedDir); await startWith(savedTarget()); }
  } catch (e) { showStart("new"); }
};

// 폴더를 끌어다 놓기
addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("dragging"); });
addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dragging"); });
addEventListener("drop", async e => {
  e.preventDefault(); document.body.classList.remove("dragging");
  const item = e.dataTransfer.items && e.dataTransfer.items[0];
  if (item && item.getAsFileSystemHandle) {
    try {
      const h = await item.getAsFileSystemHandle();
      if (h && h.kind === "directory") { savedDir = h; useHandle(h); await saveDir(h); await startWith(savedTarget()); }
    } catch (er) {}
  }
});

const VAR_NAMES = ["bg", "fg", "muted", "line", "panel", "code-fg", "link", "th", "accent", "side", "sel"];
const HL_NAMES = ["hk", "ht", "hs", "hc", "hn", "hp", "hf"];
let themeId = "";

function drawThemes() {
  const sel = $("theme");
  sel.innerHTML = "";
  sel.title = t("theme");
  for (const dark of [0, 1]) {
    const g = document.createElement("optgroup");
    g.label = t(dark ? "dark" : "light");
    for (const th of THEMES) {
      if (!!th.dark !== !!dark) continue;
      const o = document.createElement("option");
      o.value = th.id; o.textContent = th[uiLang] || th.en;
      g.append(o);
    }
    sel.append(g);
  }
  sel.value = themeId;
}

function applyTheme(id) {
  const th = THEMES.find(x => x.id === id) || THEMES[0];
  const root = document.documentElement;
  root.removeAttribute("style");
  if (th.id) root.dataset.theme = th.id; else delete root.dataset.theme;
  if (th.hrule) root.dataset.hrule = ""; else delete root.dataset.hrule;
  if (th.v) th.v.split(" ").forEach((c, k) => root.style.setProperty("--" + VAR_NAMES[k], c));
  if (th.s) th.s.split(" ").forEach((c, k) => root.style.setProperty("--" + HL_NAMES[k], c));
  if (th.font) root.style.setProperty("--font", th.font);
  if (th.v) root.style.setProperty("--err", th.dark ? "#ff6b6b" : "#d03030");
  if (th.id) root.style.colorScheme = th.dark ? "dark" : "light";
  themeId = th.id;
  $("theme").value = th.id;
}
try { applyTheme(localStorage.getItem("sv-theme") || ""); } catch (e) { applyTheme(""); }
$("theme").onchange = () => { applyTheme($("theme").value); try { localStorage.setItem("sv-theme", themeId); } catch (e) {} };

// 머리 막대 높이 (창이 좁아 두 줄이 되어도 목록·소스 영역이 맞게)
new ResizeObserver(() => document.body.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px"))
  .observe(document.querySelector("header"));

(async () => {
  drawStatic();
  if (hasFsa) {
    savedDir = await loadDir();
    if (savedDir) {
      try {
        if ((await savedDir.queryPermission({ mode: "read" })) === "granted") { useHandle(savedDir); await startWith(savedTarget()); return; }
      } catch (e) {}
      showStart("regrant"); return;
    }
  }
  showStart("new");
})();
