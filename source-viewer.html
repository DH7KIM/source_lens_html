      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*> ?/, ""));
      html += `<blockquote>${renderBlocks(body, used)}</blockquote>`; continue;
    }
    if (reItem.test(line)) {
      const r = renderList(lines, i, used); html += r.html; i = r.next; continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !(para.length && startsBlock(lines[i]))
           && !(lines[i].includes("|") && i + 1 < lines.length && reTableSep.test(lines[i + 1]))) {
      para.push(lines[i++].trim() + (/ {2,}$/.test(lines[i - 1]) ? "  " : ""));
    }
    html += `<p>${inline(para.join("\n"))}</p>`;
  }
  return html;
}

function renderList(lines, i, used) {
  const first = lines[i].match(reItem);
  const base = indentOf(first[1]);
  const ordered = /\d/.test(first[2]);
  const start = ordered ? parseInt(first[2], 10) : 1;
  let html = ordered ? `<ol${start !== 1 ? ` start="${start}"` : ""}>` : "<ul>";
  while (i < lines.length) {
    const m = lines[i].match(reItem);
    if (!m || indentOf(m[1]) !== base || /\d/.test(m[2]) !== ordered) break;
    const text = [m[3]], child = [];
    i++;
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) {
        let j = i + 1; while (j < lines.length && !lines[j].trim()) j++;
        if (j < lines.length && indentOf(lines[j]) > base) { child.push(""); i++; continue; }
        break;
      }
      if (indentOf(l) <= base) break;
      if (!child.length && !reItem.test(l) && !reFence.test(l) && !reTableSep.test(lines[i + 1] || "")) {
        text.push(l.trim()); i++; continue;
      }
      child.push(l); i++;
    }
    html += `<li>${inline(text.join("\n"))}${child.length ? renderBlocks(dedent(child), used) : ""}</li>`;
  }
  return { html: html + (ordered ? "</ol>" : "</ul>"), next: i };
}

const renderMarkdown = text => renderBlocks(text.split("\n"), new Set());

// ======================= 소스 폴더 (두 가지 방식) =======================
// 1) FSA: 폴더 핸들 (Chrome·Edge) → 자동 새로 고침, 다음 실행 때 다시 씀
// 2) files: <input webkitdirectory>로 고른 파일 목록 (다른 브라우저) → 그 순간의 내용만
const SKIP_DIRS = new Set(["obj", "gcm.cache", ".git", "target", "node_modules", "bin", "build", "Claude outputs"]);
const MAX_DEPTH = 4;
const HL_MAX = 1.5 * 1024 * 1024;    // 이보다 큰 파일은 색칠하지 않음
let src = null;          // { kind, name, list() → [path], get(path) → File }
let fileSet = new Set(); // 목록에 있는 모든 경로
let entries = new Map(); // 목록 키 → { md: { lang: path } } 또는 { path }
let cur = null;          // 지금 보는 파일 경로
let curMod = 0;          // 지금 파일의 수정 시각 (자동 새로 고침)
let docLang = uiLang;    // 고른 문서 언어
let mdRaw = false;       // .md를 원문으로 볼지
let hlLine = 0;          // 표시한 줄
const $ = id => document.getElementById(id);
const KEY = location.pathname; // file:// 페이지는 저장소를 함께 쓰므로 이 파일 경로로 구분
try { mdRaw = localStorage.getItem("sv-md-raw:" + KEY) === "1"; } catch (e) {}
let showDiag = true;     // .ui 오류를 줄 아래에 보일지
try { showDiag = localStorage.getItem("sv-diag:" + KEY) !== "0"; } catch (e) {}
// .ui 배치 미리보기 설정: 켜짐, 창 크기("fit" | "custom" | "640x480"…), 너비·높이, 배율, 아래 칸 높이
const pvSet = { on: true, mode: "layout", win: "640x480", w: 640, h: 480, scale: 100, paneH: 300 };
try { Object.assign(pvSet, JSON.parse(localStorage.getItem("sv-preview:" + KEY) || "{}")); } catch (e) {}
let pvDoc = null, pvOpen = 0;   // 미리보기: 그린 문서, 보기 모드에서 펼친 menu_button 노드 번호(0 = 없음)
const savePv = () => { try { localStorage.setItem("sv-preview:" + KEY, JSON.stringify(pvSet)); } catch (e) {} };
let pvCheck = null;      // 지금 .ui 파일의 검사 결과 (배치 미리보기용)

async function scanHandle(dir, prefix = "", depth = 0, out = []) {
  for await (const [name, h] of dir.entries()) {
    if (h.kind === "directory") {
      if (depth < MAX_DEPTH && !SKIP_DIRS.has(name) && !name.startsWith(".")) await scanHandle(h, prefix + name + "/", depth + 1, out);
    } else if (langOf(name)) out.push(prefix + name);
  }
  return out;
}

async function getHandleFile(dir, path) {
  const parts = path.split("/");
  for (let k = 0; k < parts.length - 1; k++) dir = await dir.getDirectoryHandle(parts[k]);
  return (await dir.getFileHandle(parts[parts.length - 1])).getFile();
}

function useHandle(dir) {
  src = { kind: "fsa", name: dir.name, list: () => scanHandle(dir), get: p => getHandleFile(dir, p) };
}

function useFiles(fileList) {
  const map = new Map();
  let root = "";
  for (const f of fileList) {
    const rel = f.webkitRelativePath || f.name;
    const parts = rel.split("/");
    if (parts.length > 1) { root = parts[0]; parts.shift(); }
    const dirs = parts.slice(0, -1);
    if (dirs.some(d => SKIP_DIRS.has(d) || d.startsWith(".")) || dirs.length > MAX_DEPTH) continue;
    if (langOf(rel)) map.set(parts.join("/"), f);
  }
  src = { kind: "files", name: root || "files",
          list: async () => [...map.keys()],
          get: async p => { const f = map.get(p); if (!f) throw new Error("not found"); return f; } };
}

// 이름.ko.md → { base: 이름, lang: ko },  이름.md → { base: 이름, lang: en }
function splitLang(path) {
  const m = path.match(/^(.*?)(?:\.([a-z]{2}(?:-[a-z]{2})?))?\.md$/i);
  return m ? { base: m[1], lang: (m[2] || "en").toLowerCase() } : { base: path, lang: "" };
}
const keyOf = p => isMd(p) ? splitLang(p).base + ".md" : p;

async function refreshList() {
  const paths = (await src.list()).sort();
  fileSet = new Set(paths);
  entries = new Map();
  for (const p of paths) {
    const key = keyOf(p);
    if (isMd(p)) {
      if (!entries.has(key)) entries.set(key, { md: {} });
      entries.get(key).md[splitLang(p).lang] = p;
    } else entries.set(key, { path: p });
  }
  drawNav(); drawLangs();
  return paths.length;
}

// README, CHANGELOG를 먼저, 그다음 폴더 없는 파일, 폴더별 파일
function orderedKeys() {
  const rank = k => /^readme\.md$/i.test(k) ? 0 : /^changelog\.md$/i.test(k) ? 1 : k.includes("/") ? 3 : 2;
  const dir = k => k.slice(0, k.lastIndexOf("/") + 1);
  return [...entries.keys()].sort((a, b) => rank(a) - rank(b) || dir(a).localeCompare(dir(b)) || a.localeCompare(b));
}

function pathFor(key, lang) {
  const e = entries.get(key);
  if (!e) return null;
  if (!e.md) return e.path;
  return e.md[lang] || e.md.en || Object.values(e.md)[0];
}

// ---------- 트리 목록 (폴더 접기·펼치기, 접은 폴더는 브라우저에 기억) ----------
// 각 폴더 안의 순서: README·CHANGELOG → 하위 폴더 → 그 밖의 파일 (이름순)
let closed = new Set();  // 접은 폴더 경로 ("src/", "src/ui/")
try { closed = new Set(JSON.parse(localStorage.getItem("sv-closed:" + KEY) || "[]")); } catch (e) {}
function saveClosed() { try { localStorage.setItem("sv-closed:" + KEY, JSON.stringify([...closed])); } catch (e) {} }
/// 이 파일이 들어 있는 폴더를 모두 펼침
function expandTo(path) {
  const parts = path.split("/");
  let changed = false;
  for (let k = 1; k < parts.length; k++) if (closed.delete(parts.slice(0, k).join("/") + "/")) changed = true;
  if (changed) saveClosed();
}

function buildTree() {
  const root = { dirs: new Map(), files: [] };
  for (const key of entries.keys()) {
    const parts = key.split("/");
    let n = root;
    for (let k = 0; k < parts.length - 1; k++) {
      if (!n.dirs.has(parts[k])) n.dirs.set(parts[k], { dirs: new Map(), files: [] });
      n = n.dirs.get(parts[k]);
    }
    n.files.push(key);
  }
  return root;
}

const ICON_CHEVRON = '<svg class="tw" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_FOLDER = '<svg class="fi" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 3.25h4.1l1.5 1.6h6.9v8.4H1.75z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';

/// 줄 앞에 연결선 칸을 붙임 (칸: "" 빈칸, v │, t ├, l └)
function guides(el, list, isFile) {
  list.forEach((c, k) => {
    if (!c) return;
    const s = document.createElement("span");
    s.className = "g " + c + (isFile ? " f" : "");
    s.style.setProperty("--k", k);
    el.prepend(s);
  });
}

function drawNav() {
  const nav = $("nav");
  const top = nav.scrollTop;
  nav.innerHTML = "";
  const fileRank = k => { const n = k.slice(k.lastIndexOf("/") + 1); return /^readme\.md$/i.test(n) ? 0 : /^changelog\.md$/i.test(n) ? 1 : 2; };
  const fileRow = (key, depth) => {
    const p = pathFor(key, docLang);
    const a = document.createElement("a");
    a.style.setProperty("--d", depth);
    const dot = document.createElement("span");
    dot.className = "dot " + langOf(p);
    a.append(dot, key.slice(key.lastIndexOf("/") + 1));
    if (isMd(p)) {
      const lang = splitLang(p).lang;
      if (lang !== docLang) { const s = document.createElement("span"); s.className = "alt"; s.textContent = lang; a.append(s); }
    }
    a.title = p;
    if (p === cur) a.className = "cur";
    a.onclick = () => openFile(p);
    nav.append(a);
  };
  const walk = (node, prefix, depth, trail) => {
    const files = node.files.sort((a, b) => fileRank(a) - fileRank(b) || a.localeCompare(b));
    const kids = [...files.filter(f => fileRank(f) < 2).map(f => ({ f })),
                  ...[...node.dirs].sort((a, b) => a[0].localeCompare(b[0])).map(([name, sub]) => ({ name, sub })),
                  ...files.filter(f => fileRank(f) === 2).map(f => ({ f }))];
    kids.forEach((kid, i) => {
      const last = i === kids.length - 1;
      // 연결선: 위 칸들은 그 조상 폴더 뒤에 형제가 있으면 │, 마지막 칸은 ├ (마지막 항목이면 └)
      const g = depth ? [...trail.map(l => l ? "" : "v"), last ? "l" : "t"] : [];
      if (kid.f) { fileRow(kid.f, depth); guides(nav.lastChild, g, true); return; }
      const path = prefix + kid.name + "/";
      const open = !closed.has(path);
      const d = document.createElement("div");
      d.className = "dir" + (open ? " open" : "") + (!open && cur && cur.startsWith(path) ? " has-cur" : "");
      d.style.setProperty("--d", depth);
      d.innerHTML = ICON_CHEVRON + ICON_FOLDER;
      d.append(kid.name);
      d.title = path + "\n" + t("dirTip");
      d.onclick = () => { if (open) closed.add(path); else closed.delete(path); saveClosed(); drawNav(); };
      nav.append(d);
      guides(d, g, false);
      if (open) walk(kid.sub, path, depth + 1, depth ? [...trail, last] : []);
    });
  };
  walk(buildTree(), "", 0, []);
  nav.hidden = false;
  $("navSize").hidden = false;
  nav.scrollTop = top;
  if (!navWidthSaved) fitNav();
}

// ---------- 목록 폭 (끌어서 조절, 두 번 클릭 = 이름에 맞춤, 브라우저에 기억) ----------
let navWidthSaved = false;
function setNavWidth(px, save) {
  const w = Math.round(Math.min(Math.max(px, 140), innerWidth * 0.6));
  document.body.style.setProperty("--nav-w", w + "px"); // <html>의 style은 테마가 바꾸므로 body에
  if (save) { navWidthSaved = true; try { localStorage.setItem("sv-nav-w:" + KEY, String(w)); } catch (e) {} }
}
function fitNav() {
  let max = 0;
  for (const a of $("nav").querySelectorAll("a, .dir")) {
    a.style.width = "max-content";
    max = Math.max(max, a.getBoundingClientRect().width);
    a.style.width = "";
  }
  const nav = $("nav"), cs = getComputedStyle(nav);
  const extra = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + parseFloat(cs.borderRightWidth)
              + (nav.offsetWidth - nav.clientWidth - parseFloat(cs.borderRightWidth));
  if (max) setNavWidth(Math.ceil(max + extra + 2), false);
}
try { const w = +localStorage.getItem("sv-nav-w:" + KEY); if (w > 0) { navWidthSaved = true; setNavWidth(w, false); } } catch (e) {}
$("navSize").addEventListener("pointerdown", e => {
  e.preventDefault();
  const h = $("navSize"); h.setPointerCapture(e.pointerId);
  const left = $("nav").getBoundingClientRect().left;
  document.body.classList.add("resizing");
  const move = ev => setNavWidth(ev.clientX - left, false);
  const up = ev => {
    setNavWidth(ev.clientX - left, true);
    document.body.classList.remove("resizing");
    h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up);
  };
  h.addEventListener("pointermove", move); h.addEventListener("pointerup", up);
});
$("navSize").addEventListener("dblclick", () => {
  navWidthSaved = false;
  try { localStorage.removeItem("sv-nav-w:" + KEY); } catch (e) {}
  fitNav();
});

function drawLangs() {
  const all = new Set();
  for (const e of entries.values()) if (e.md) for (const l of Object.keys(e.md)) all.add(l);
  const box = $("langs");
  box.innerHTML = "";
  if (all.size < 2) return;
  for (const l of [...all].sort((a, b) => (a === "ko" ? -1 : b === "ko" ? 1 : a.localeCompare(b)))) {
    const b = document.createElement("button");
    b.textContent = LANG_NAMES[l] || l;
    b.title = t("langTip");
    b.className = l === docLang ? "on" : "";
    b.onclick = () => {
      docLang = l;
      if (UI[l]) uiLang = l;
      if (cur && isMd(cur)) openFile(pathFor(keyOf(cur), l));
      else { drawNav(); drawLangs(); drawStatic(); drawPreview(); }
    };
    box.append(b);
  }
}

// a/b/c.md 기준으로 상대 경로 풀기
function resolve(fromPath, href) {
  const parts = fromPath.split("/"); parts.pop();
  for (const seg of href.split("/")) {
    if (seg === "" || seg === ".") continue;
    if (seg === "..") parts.pop(); else parts.push(seg);
  }
  return parts.join("/");
}

/// 파일 → 글. UTF-8이 아니면 EUC-KR(CP949), BOM이 있으면 UTF-16
/// .ui는 UTF-8로만 읽는다 (형식이 UTF-8만 허용). 틀린 바이트는 �로 보이고 검사기가 E004로 알린다.
async function readText(f, utf8Only = false) {
  const b = new Uint8Array(await f.arrayBuffer());
  let text, enc;
  if (b[0] === 0xFF && b[1] === 0xFE) { text = new TextDecoder("utf-16le").decode(b); enc = "UTF-16"; }
  else if (b[0] === 0xFE && b[1] === 0xFF) { text = new TextDecoder("utf-16be").decode(b); enc = "UTF-16"; }
  else {
    try { text = new TextDecoder("utf-8", { fatal: true }).decode(b); enc = "UTF-8"; }
    catch (e) {
      if (utf8Only) { text = new TextDecoder("utf-8").decode(b); enc = "UTF-8 (!)"; }
      else { text = new TextDecoder("euc-kr").decode(b); enc = "EUC-KR"; }
    }
  }
  // .ui는 검사기와 같게 CRLF만 LF로 (줄 번호가 맞게)
  return { text: text.replace(/^\uFEFF/, "").replace(utf8Only ? /\r\n/g : /\r\n?/g, "\n"), enc, size: b.length, bytes: b };
}

const fmtSize = n => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB";

function setState(text, err = false) { $("state").textContent = text; $("state").className = "state" + (err ? " err" : ""); }

async function openFile(path, { hash = "", line = 0, keepScroll = false } = {}) {
  let f;
  try { f = await src.get(path); }
  catch (e) { setState(t("notFound", path), true); return; }
  const codeEl = $("code"), art = $("out");
  const prevY = !codeEl.hidden ? codeEl.scrollTop : scrollY;
  const lang = langOf(path);
  const { text, enc, size, bytes } = await readText(f, lang === "ui");
  const changed = path !== cur;
  if (changed) expandTo(path);
  cur = path; curMod = f.lastModified;
  if (changed) hlLine = 0;
  if (line) hlLine = line;
  if (lang === "md") {
    docLang = splitLang(path).lang;
    if (UI[docLang]) uiLang = docLang;
    document.documentElement.lang = docLang;
  }
  const asDoc = lang === "md" && !mdRaw;
  let lineCount = 0, note = "", check = null;
  if (asDoc) {
    art.innerHTML = renderMarkdown(text);
    await loadImages();
    codeEl.hidden = true; art.hidden = false;
    lineCount = text.split("\n").length;
  } else {
    if (text.includes("\u0000") && enc !== "UTF-16") {
      codeEl.innerHTML = `<div class="msg">${esc(t("binary"))}</div>`;
    } else {
      const big = text.length > HL_MAX;
      if (big) note = t("tooBig");
      let toks = big || lang === "plain" ? [[null, text]] : highlight(text, lang);
      // .ui 전체 검사 (ui-check와 같은 결과). 오류·경고 범위에 밑줄, 줄 아래에 진단
      if (lang === "ui") { check = uiCheck.check(bytes); if (!big) toks = markUiDiags(toks, check.diags); }
      const diags = check ? check.diags : [];
      const lines = tokensToLines(toks);
      if (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();
      lineCount = lines.length;
      const sevOf = new Map();   // 줄(0부터) → "bad"(오류) | "warn"(경고만)
      for (const d of diags) if (d.severity === "error" || !sevOf.has(d.line - 1)) sevOf.set(d.line - 1, d.severity === "error" ? "bad" : "warn");
      codeEl.style.setProperty("--no-w", (String(lineCount).length + 3) + "ch");
      let html = '<div class="lines">';
      // 오류 줄 아래에 진단 끼워 넣기 (줄 번호 없음, 복사 안 됨)
      const byLine = new Map();
      if (showDiag) for (const d of diags) { if (!byLine.has(d.line - 1)) byLine.set(d.line - 1, []); byLine.get(d.line - 1).push(d); }
      const srcLines = text.split("\n");
      lines.forEach((l, k) => {
        html += `<div class="r${k + 1 === hlLine ? " hl" : ""}${sevOf.has(k) ? " " + sevOf.get(k) : ""}" id="L${k + 1}"><span class="no" data-n="${k + 1}"></span><span class="tx">${l}</span></div>`;
        for (const d of byLine.get(k) || []) html += diagRows(d, srcLines[k] || "");
      });
      // 파일 끝을 넘는 줄의 진단 (빈 파일의 E001 등)은 마지막 줄 아래에
      for (const [k, list] of byLine) if (k >= lines.length) for (const d of list) html += diagRows(d, "");
      codeEl.innerHTML = html + "</div>";
    }
    art.hidden = true; codeEl.hidden = false;
  }
  $("start").hidden = true;
  $("name").textContent = (src.name ? src.name + " / " : "") + path;
  document.title = path + " - Source Viewer";
  setState([lineCount ? t("lines", lineCount) : "", fmtSize(size), enc, src.kind === "fsa" ? t("auto") : t("noAuto"), note].filter(Boolean).join(" · "));
  if (check) {   // .ui 검사 결과: 오류(빨강)·경고(주황)·문제 없음
    const b = document.createElement("span");
    const parts = [];
    if (check.errorCount) parts.push(t("uiErrs", check.errorCount));
    if (check.warningCount) parts.push(t("uiWarns", check.warningCount));
    b.className = check.errorCount ? "bad" : check.warningCount ? "warn" : "okay";
    b.textContent = " · " + (parts.length ? parts.join(" · ") : t("uiOk"));
    b.title = t("uiErrsTip", UI_DOC_VERSION);
    $("state").append(b);
  }
  pvCheck = lang === "ui" && check ? check : null;
  drawNav(); drawLangs(); drawStatic(); drawPreview();
  try { localStorage.setItem("sv-last:" + KEY, path); } catch (e) {}
  if (changed || line || hash) setHash(hash);
  if (asDoc) {
    if (hash) { const el = document.getElementById(decodeURIComponent(hash)); if (el) { el.scrollIntoView(); return; } }
    scrollTo(0, keepScroll ? prevY : 0);
  } else {
    scrollTo(0, 0);
    if (keepScroll) codeEl.scrollTop = prevY;
    else if (line) { const r = $("L" + line); if (r) r.scrollIntoView({ block: "center" }); }
    else codeEl.scrollTop = 0;
  }
}

/// 진단 2줄: "   ^^^^ error[E003]: 메시지" / "        help: 추천" (경고는 warning[W103], 주황)
/// 앞부분은 원래 줄의 글자(칸 = 코드 포인트)를 투명하게 그대로 써서, 탭·한글이 있어도 칸이 맞는다.
/// 글자는 모두 CSS ::before(data-t)로 그려서 선택·복사되지 않는다 (줄 번호와 같은 방식)
function diagRows(d, line) {
  const span = (cls, text) => `<span class="${cls}" data-t="${esc(text)}"></span>`;
  const pad = span("pad", [...line].slice(0, d.col - 1).join(""));
  const row = body => `<div class="r dg${d.severity === "warning" ? " dw" : ""}"><span class="no"></span><span class="tx">${body}</span></div>`;
  const w = Math.max(d.length, 1);
  let html = row(pad + span("x", "^".repeat(w) + " " + d.severity + "[" + d.code + "]") + span("dm", ": " + d.msg));
  if (d.help) html += row(pad + span("dh", " ".repeat(w + 1) + "help: " + d.help));
  return html;
}

function setHash(anchor = "") {
  history.replaceState(null, "", "#" + encodeURI(cur) + (hlLine && !$("code").hidden ? ":L" + hlLine : anchor ? "#" + anchor : ""));
}

// 줄 번호 클릭 → 그 줄 표시 (주소에 남김)
$("code").addEventListener("click", e => {
  const no = e.target.closest(".no");
  if (!no) return;
  const n = +no.dataset.n;
  for (const r of $("code").querySelectorAll(".r.hl")) r.classList.remove("hl");
  if (hlLine === n) hlLine = 0;
  else { hlLine = n; no.parentElement.classList.add("hl"); }
  setHash(); markPreview();
});

async function loadImages() {
  for (const img of $("out").querySelectorAll("img[data-src]")) {
    const u = img.dataset.src;
    if (/^(https?:|data:)/.test(u)) { img.src = u; continue; }
    try { img.src = URL.createObjectURL(await src.get(resolve(cur, u))); } catch (e) {}
  }
}

// 문서 안 링크: 폴더 안 파일은 이 뷰어에서 (file.rs#L12 → 12번 줄), #은 제목으로, http는 새 탭
$("out").addEventListener("click", e => {
  const a = e.target.closest("a[data-href]");
  if (!a) return;
  e.preventDefault();
  const href = a.dataset.href;
  if (/^(https?:|mailto:)/i.test(href)) { open(href, "_blank", "noopener"); return; }
  if (href.startsWith("#")) { const el = document.getElementById(decodeURIComponent(href.slice(1))); if (el) el.scrollIntoView(); return; }
  const [p, h = ""] = href.split("#");
  const target = resolve(cur, decodeURI(p));
  if (!fileSet.has(target)) { setState(t("notFile", href), true); return; }
  const ln = h.match(/^L(\d+)$/);
  openFile(target, ln ? { line: +ln[1] } : { hash: h });
});

/// 주소의 #경로, #경로:L12, #경로#제목 → { path, line, hash }
function savedTarget() {
  const raw = decodeURI(location.hash.slice(1));
  if (raw) {
    const [p, h = ""] = raw.split("#");
    const m = p.match(/^(.*):L(\d+)$/);
    return m ? { path: m[1], line: +m[2] } : { path: p, hash: h };
  }
  try { return { path: localStorage.getItem("sv-last:" + KEY) }; } catch (e) { return { path: null }; }
}

async function startWith(target) {
  const n = await refreshList();
  if (!n) { showStart("noFiles"); return; }
  $("folder").hidden = false;
  if (target && target.path && fileSet.has(target.path)) openFile(target.path, { line: target.line || 0, hash: target.hash || "" });
  else openFile(pathFor(orderedKeys()[0], docLang));
}

function db() {
  return new Promise((ok, no) => {
    const r = indexedDB.open("source-viewer", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  });
}
async function saveDir(h) {
  try { const d = await db(); d.transaction("kv", "readwrite").objectStore("kv").put(h, "dir:" + KEY); } catch (e) {}
}
async function loadDir() {
  try {
    const d = await db();
    return await new Promise(ok => { const r = d.transaction("kv").objectStore("kv").get("dir:" + KEY); r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null); });
  } catch (e) { return null; }
}

    try {

      if (h && h.kind === "directory") { savedDir = h; useHandle(h); await saveDir(h); await startWith(savedTarget()); }

const HL_NAMES = ["hk", "ht", "hs", "hc", "hn", "hp", "hf"];
let themeId = "";

function drawThemes() {
  const sel = $("theme");
  sel.innerHTML = "";
  sel.title = t("theme");
  for (const dark of [0, 1]) {
    const g = document.createElement("optgroup");
    g.label = t(dark ? "dark" : "light");
    for (const th of THEMES) {
      if (!!th.dark !== !!dark) continue;
      const o = document.createElement("option");
      o.value = th.id; o.textContent = th[uiLang] || th.en;
      g.append(o);
    }
    sel.append(g);
  }
  sel.value = themeId;
}

function applyTheme(id) {
  const th = THEMES.find(x => x.id === id) || THEMES[0];
  const root = document.documentElement;
  root.removeAttribute("style");
  if (th.id) root.dataset.theme = th.id; else delete root.dataset.theme;
  if (th.hrule) root.dataset.hrule = ""; else delete root.dataset.hrule;
  if (th.v) th.v.split(" ").forEach((c, k) => root.style.setProperty("--" + VAR_NAMES[k], c));
  if (th.s) th.s.split(" ").forEach((c, k) => root.style.setProperty("--" + HL_NAMES[k], c));
  if (th.font) root.style.setProperty("--font", th.font);
  if (th.v) root.style.setProperty("--err", th.dark ? "#ff6b6b" : "#d03030");
  if (th.v) root.style.setProperty("--warn", th.dark ? "#e8a33d" : "#b06a00");
  if (th.id) root.style.colorScheme = th.dark ? "dark" : "light";
  themeId = th.id;
  $("theme").value = th.id;
}
try { applyTheme(localStorage.getItem("sv-theme") || ""); } catch (e) { applyTheme(""); }

let pvCtx = null;
function setPaneH(px, save) {
  const max = Math.max(80, innerHeight - (document.querySelector("header").offsetHeight) - 80);
  pvSet.paneH = Math.round(Math.min(max, Math.max(80, px)));
  document.body.style.setProperty("--pv-h", pvSet.paneH + "px");
  if (save) savePv();
}
function drawPreview() {
  hideTooltip();
  const on = !!pvCheck && pvSet.on;
  $("pv").hidden = $("pvSize").hidden = !on;
  document.body.classList.toggle("pv-on", on);
  if (!on) { $("pvStage").innerHTML = ""; return; }
  setPaneH(pvSet.paneH, false);
  const view = pvSet.mode === "view";
  $("pv").classList.toggle("pv-view", view);
  for (const [id, m] of [["pvModeL", "layout"], ["pvModeV", "view"]]) {
    $(id).textContent = t(id); $(id).title = t(id + "Tip"); $(id).setAttribute("aria-pressed", String(pvSet.mode === m));
  }
  // 머리 줄: 창 크기 목록, 너비·높이, 배율
  const sel = $("pvWin");
  sel.innerHTML = [["fit", t("pvFit")], ...PV_SIZES.map(v => [v, v.replace("x", " × ")]), ["custom", t("pvCustom")]]
    .map(([v, l]) => `<option value="${v}"${v === pvSet.win ? " selected" : ""}>${esc(l)}</option>`).join("");
  sel.title = t("pvWinTip");
  $("pvScale").innerHTML = PV_SCALES.map(v => `<option value="${v}"${v === pvSet.scale ? " selected" : ""}>${v}%</option>`).join("");
  $("pvScale").title = t("pvScaleTip");
  $("pvWT").textContent = t("pvW"); $("pvHT").textContent = t("pvH");
  $("pvWL").title = $("pvHL").title = t("pvWHTip");
  $("pvSize").title = t("pvSizeTip");
  const stage = $("pvStage"), fit = pvSet.win === "fit";
  let w = pvSet.w, h = pvSet.h;
  if (fit) { w = Math.max(1, stage.clientWidth - 26); h = Math.max(1, stage.clientHeight - 26); }
  else if (pvSet.win !== "custom") [w, h] = pvSet.win.split("x").map(Number);
  $("pvW").value = w; $("pvH").value = h;
  $("pvW").disabled = $("pvH").disabled = fit;
  // 오류: 복구해서 그림 / 복구할 수 없으면 안내만
  const note = $("pvNote");
  note.textContent = ""; note.className = ""; note.title = "";
  let doc = pvCheck;
  if (doc.errorCount) {
    doc = uiCheck.recover(doc);
    if (!doc) { stage.innerHTML = `<div class="pv-msg">${esc(t("pvCannot"))}</div>`; return; }
    note.textContent = t("pvRecovered", pvCheck.errorCount); note.className = "bad"; note.title = t("pvRecoveredTip");
  }
  // 글꼴: 12px, 줄 높이 16 (96 DPI) × 배율
  const scale = pvSet.scale, fontPx = 12 * scale / 100, lineH = Math.round(16 * scale / 100);
  pvCtx ||= document.createElement("canvas").getContext("2d");
  pvCtx.font = `${fontPx}px ${PV_FONT}`;
  const textWidth = b => Math.ceil(pvCtx.measureText(uiCheck.text(b)).width);
  const rects = uiCheck.compute(doc, w, h, { textWidth, lineHeight: lineH, scale });
  const K = uiCheck.KIND_NAMES;
  pvDoc = doc;
  let html = `<div class="pv-wrap"><div class="pv-win" style="width:${w}px;height:${h}px;font:${fontPx}px/${lineH}px ${esc(PV_FONT)}">`;
  for (let i = 1; i < rects.length; i++) {
    const n = doc.nodes[i], kind = K[n.kind];
    if (n.dropped || !["label", "button", "text_field", "number_field", "menu_button", "checkbox", "canvas", "group", "row", "column"].includes(kind)) continue;
    const r = rects[i], name = uiCheck.text(n.name), txt = esc(uiCheck.text(n.text));
    const tip = t("pvBox", `${kind} ${name}`.trim(), r.x, r.y, r.w, r.h, n.line) + (n.hidden ? " " + t("pvHidden") : "") + (n.disabled ? " " + t("pvDisabled") : "") + "\n" + (!view ? t("pvBoxGo") : kind === "menu_button" ? t("pvDropGo") : "");
    let body = "";
    switch (kind) {
      case "label": body = txt; break;
      case "button": body = txt; break;
      case "menu_button": body = `<span>${txt}</span><span>▾</span>`; break;
      case "text_field": body = `<span class="h">${esc(uiCheck.text(n.placeholder))}</span>`; break;
      case "number_field": body = `<span>${n.hex ? "0x" + n.minValue.toString(16).toUpperCase() : n.minValue}</span><span>⇕</span>`; break;
      case "checkbox": body = `${n.checked ? "☑" : "☐"} ${txt}`; break;
      case "group": case "row": case "column": body = `<span class="tag">${esc(`${kind} ${name}`.trim())}</span>`; break;
    }
    // 보기 모드: 위치 설명 대신 프로그램의 풍선 도움말 (disabled면 disabled_tooltip, 없으면 tooltip; 빈 글·숨긴 요소는 안 보임)
    const tooltip = uiCheck.text(n.disabled && n.disabledTooltip !== null ? n.disabledTooltip : n.tooltip ?? "");
    const attr = !view ? ` title="${esc(tip)}"` : tooltip && !n.hidden ? ` data-tooltip="${esc(tooltip)}"` : "";
    const just = kind === "label" ? ` justify-content:${n.align === "center" ? "center" : n.align === "right" ? "flex-end" : "flex-start"};` : "";
    html += `<div data-i="${i}" data-ln="${n.line}" class="pv-${kind}${n.hidden ? " pv-hidden" : ""}${n.disabled ? " pv-disabled" : ""}${n.line === hlLine ? " pv-cur" : ""}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;${just}"${attr}>${body}</div>`;
  }
  stage.innerHTML = html + "</div></div>";
  if (view && pvOpen > 0) openMenu(pvOpen); else pvOpen = 0;
}
// ---------- 보기 모드: menu_button → menu 펼치기 (보기만, 클릭으로 radio·checkbox를 바꾸지 않음) ----------
// menu 노드 → 풀다운 HTML. 안쪽 menu는 하위 메뉴(마우스를 올리면 오른쪽에 펼침)
function menuHtml(doc, mi, depth) {
  const m = doc.nodes[mi];
  let h = `<div class="pv-pop">`, any = false;
  for (const c of m.children) {
    const n = doc.nodes[c], kind = uiCheck.KIND_NAMES[n.kind];
    if (n.dropped || n.hidden) continue;
    if (kind === "separator") { h += `<div class="sep" title="${esc(t("pvItem", "separator", n.line))}"></div>`; continue; }
    if (kind !== "menu_item" && kind !== "menu") continue;
    any = true;
    const sub = kind === "menu" && depth < 8;
    const mark = n.checked ? (n.radio ? "●" : "✓") : "";
    const tip = t("pvItem", `${kind} ${uiCheck.text(n.name)}`.trim(), n.line) + (n.disabled ? " " + t("pvDisabled") : "");
    h += `<div class="mi${n.disabled ? " dis" : ""}" title="${esc(tip)}"><span class="mk">${mark}</span><span class="tx">${esc(uiCheck.text(n.text) || uiCheck.text(n.name))}</span>`
      + (sub ? `<span class="ar">▸</span>${menuHtml(doc, c, depth + 1)}` : "") + `</div>`;
  }
  if (!any) h += `<div class="mi dis"><span class="mk"></span><span class="tx">${esc(t("pvEmpty"))}</span></div>`;
  return h + `</div>`;
}
function closeMenu() {
  pvOpen = 0;
  for (const x of $("pvStage").querySelectorAll(".pv-wrap > .pv-pop")) x.remove();
  for (const x of $("pvStage").querySelectorAll(".pv-open")) x.classList.remove("pv-open");
}
function openMenu(i) {
  closeMenu();
  const b = $("pvStage").querySelector(`.pv-win > div[data-i="${i}"]`), n = pvDoc && pvDoc.nodes[i];
  if (!b || !n) return;
  pvOpen = i; b.classList.add("pv-open");
  const win = b.parentElement, x = b.offsetLeft + win.clientLeft, y = b.offsetTop + b.offsetHeight + win.clientTop;
  const wrap = win.parentElement, tmp = document.createElement("div");
  tmp.innerHTML = n.menu > 0 && pvDoc.nodes[n.menu] ? menuHtml(pvDoc, n.menu, 0) : `<div class="pv-pop"><div class="mi dis"><span class="mk"></span><span class="tx">${esc(t("pvNoMenu"))}</span></div></div>`;
  const pop = tmp.firstElementChild;
  pop.style.left = x + "px"; pop.style.top = y + "px"; pop.style.font = win.style.font;
  pop.style.minWidth = b.offsetWidth + "px";
  wrap.appendChild(pop);
}
for (const id of ["pvModeL", "pvModeV"]) $(id).onclick = () => { pvSet.mode = $(id).dataset.m; savePv(); closeMenu(); drawPreview(); };
addEventListener("keydown", e => { if (e.key === "Escape" && pvOpen) closeMenu(); });
document.addEventListener("pointerdown", e => {
  if (pvOpen && !e.target.closest(".pv-pop") && !e.target.closest(".pv-open")) closeMenu();
}, true);
// ---------- 보기 모드: 풍선 도움말 (프로그램처럼 0.5초 뒤 커서 아래에, 상자를 떠나면 닫힘) ----------
const TOOLTIP_DELAY = 500;
let tooltipTimer = 0, tooltipBox = null, tooltipX = 0, tooltipY = 0;
function hideTooltip() {
  clearTimeout(tooltipTimer); tooltipTimer = 0; tooltipBox = null;
  $("pvTooltip").hidden = true;
}
function showTooltip() {
  tooltipTimer = 0;
  if (!tooltipBox || !tooltipBox.isConnected || pvOpen) return;
  const tt = $("pvTooltip");
  tt.textContent = tooltipBox.dataset.tooltip;
  tt.style.font = tooltipBox.parentElement.style.font;
  tt.hidden = false;
  const w = tt.offsetWidth, h = tt.offsetHeight;
  let x = tooltipX, y = tooltipY + 20;                         // 커서 아래 (커서 높이만큼)
  if (x + w > innerWidth - 4) x = Math.max(4, innerWidth - 4 - w);
  if (y + h > innerHeight - 4) y = Math.max(4, tooltipY - h - 4); // 아래가 모자라면 커서 위로
  tt.style.left = x + "px"; tt.style.top = y + "px";
}
$("pvStage").addEventListener("mouseover", e => {
  if (pvSet.mode !== "view") return;
  const b = e.target.closest(".pv-win > div[data-tooltip]");
  if (b === tooltipBox) return;
  hideTooltip();
  if (!b) return;
  tooltipBox = b; tooltipX = e.clientX; tooltipY = e.clientY;
  tooltipTimer = setTimeout(showTooltip, TOOLTIP_DELAY);
});
$("pvStage").addEventListener("mousemove", e => { if (tooltipTimer) { tooltipX = e.clientX; tooltipY = e.clientY; } });
$("pvStage").addEventListener("mouseleave", hideTooltip);
$("pvStage").addEventListener("scroll", hideTooltip);
addEventListener("pointerdown", hideTooltip, true);
addEventListener("wheel", hideTooltip, { capture: true, passive: true });
addEventListener("keydown", e => { if (e.key === "Escape") hideTooltip(); });
addEventListener("blur", hideTooltip);
// 표시한 줄(hlLine)의 상자 강조
function markPreview() {
  for (const b of $("pvStage").querySelectorAll(".pv-win > div[data-ln]")) b.classList.toggle("pv-cur", +b.dataset.ln === hlLine);
}
// 상자 클릭 → 소스의 그 줄로 이동 + 강조
$("pvStage").addEventListener("click", e => {
  if (pvSet.mode === "view") {
    if (e.target.closest(".pv-pop")) {   // 항목 클릭 = 메뉴 닫기 (하위 메뉴·흐린 항목은 그대로)
      const it = e.target.closest(".mi");
      if (it && !it.classList.contains("dis") && !it.querySelector(".pv-pop")) closeMenu();
      return;
    }
    const d = e.target.closest(".pv-win > div.pv-menu_button");
    if (d) { if (pvOpen === +d.dataset.i) closeMenu(); else openMenu(+d.dataset.i); }
    return;
  }
  const b = e.target.closest(".pv-win > div[data-ln]");
  if (!b) return;
  const n = +b.dataset.ln, r = $("L" + n);
  if (!r) return;
  for (const x of $("code").querySelectorAll(".r.hl")) x.classList.remove("hl");
  hlLine = n; r.classList.add("hl");
  r.scrollIntoView({ block: "center" });
  setHash(); markPreview();
});
$("pvBtn").onclick = () => { pvSet.on = !pvSet.on; savePv(); drawStatic(); drawPreview(); };
$("pvWin").onchange = () => {
  pvSet.win = $("pvWin").value;
  if (pvSet.win === "custom") { pvSet.w = +$("pvW").value || 640; pvSet.h = +$("pvH").value || 480; }
  savePv(); drawPreview();
};
$("pvScale").onchange = () => { pvSet.scale = +$("pvScale").value || 100; savePv(); drawPreview(); };
for (const id of ["pvW", "pvH"]) $(id).onchange = () => {
  const clampWH = v => Math.min(10000, Math.max(1, Math.round(+v) || 1));
  pvSet.win = "custom"; pvSet.w = clampWH($("pvW").value); pvSet.h = clampWH($("pvH").value);
  savePv(); drawPreview();
};
$("pvSize").addEventListener("pointerdown", e => {
  e.preventDefault();
  const h = $("pvSize"); h.setPointerCapture(e.pointerId);
  document.body.classList.add("resizing-v");
  const move = ev => { setPaneH(innerHeight - ev.clientY - 3, false); if (pvSet.win === "fit") drawPreview(); };
  const up = ev => {
    setPaneH(innerHeight - ev.clientY - 3, true); drawPreview();
    document.body.classList.remove("resizing-v");
    h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up);
  };
  h.addEventListener("pointermove", move); h.addEventListener("pointerup", up);
});
addEventListener("resize", () => { if (pvCheck && pvSet.on) drawPreview(); });

// 머리 막대 높이 (창이 좁아 두 줄이 되어도 목록·소스 영역이 맞게)
new ResizeObserver(() => document.body.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px"))
  .observe(document.querySelector("header"));

(async () => {
  drawStatic();
  if (hasFsa) {
    savedDir = await loadDir();
    if (savedDir) {
      try {
        if ((await savedDir.queryPermission({ mode: "read" })) === "granted") { useHandle(savedDir); await startWith(savedTarget()); return; }
      } catch (e) {}
      showStart("regrant"); return;
    }
  }
  showStart("new");
})();
</script>
</body>
</html>
