</style>
</head>
<body>
<header>
  <span class="name" id="name">Source Viewer</span>
  <span class="state" id="state"></span>
  <span class="state" id="reading" hidden><span id="readingText"></span> <button id="readCancel"></button></span>
  <button id="langBtn" class="with-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><ellipse cx="12" cy="12" rx="4" ry="9.5"/><path d="M2.5 12h19"/></svg><span id="langBtnName"></span></button>
  <button id="typesBtn" class="with-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5h8l4.5 4.5v14.5H6z"/><path d="M14 2.5V7h4.5"/><path d="M9 12h6M9 16h6"/></svg><span id="typesBtnName"></span></button>
  <button id="folder" class="with-icon" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5A1.5 1.5 0 0 1 4 5h5l2 2.5h9a1.5 1.5 0 0 1 1.5 1.5v9.5a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 18.5z"/></svg><span id="folderName"></span></button>
  <button id="settingsBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 4.6 L10.6 1.9 L13.4 1.9 L13.7 4.6 L16.0 5.6 L18.1 3.9 L20.1 5.9 L18.4 8.0 L19.4 10.3 L22.1 10.6 L22.1 13.4 L19.4 13.7 L18.4 16.0 L20.1 18.1 L18.1 20.1 L16.0 18.4 L13.7 19.4 L13.4 22.1 L10.6 22.1 L10.3 19.4 L8.0 18.4 L5.9 20.1 L3.9 18.1 L5.6 16.0 L4.6 13.7 L1.9 13.4 L1.9 10.6 L4.6 10.3 L5.6 8.0 L3.9 5.9 L5.9 3.9 L8.0 5.6Z"/><circle cx="12" cy="12" r="3"/></svg></button>
</header>
<div class="wrap">
  <nav id="nav" hidden></nav>
  <div id="navSize" hidden></div>
  <main>
    <div id="fileBar" hidden>
      <button id="mdMode" hidden></button>
      <span class="mode-seg" id="treeMode" hidden><button id="treeSrc"></button><button id="treeTree"></button></span>
      <select id="jsonSyntax" hidden></select>
      <button id="diagBtn" hidden></button>
      <button id="wrapBtn" hidden></button>
      <button id="pvBtn" hidden></button>
    </div>
    <div class="start" id="start">
      <div class="box">
        <p id="startMsg"></p>
        <p>
          <button id="pick" hidden></button>
          <button id="regrant" hidden></button>
          <button id="pickFiles" hidden></button>
        </p>
        <p class="note" id="startNote"></p>
      </div>
    </div>
    <article class="md" id="out" hidden></article>
    <div class="code" id="code" hidden></div>
    <div id="pvSize" hidden></div>
    <div id="pv" hidden>
      <div class="pv-bar">
        <span class="pv-mode"><button id="pvModeL" data-m="layout"></button><button id="pvModeV" data-m="view"></button></span>
        <select id="pvWin"></select>
        <label id="pvWL"><span id="pvWT"></span><input type="number" id="pvW" min="1" max="10000"></label>
        <label id="pvHL"><span id="pvHT"></span><input type="number" id="pvH" min="1" max="10000"></label>
        <select id="pvScale"></select>
        <span id="pvNote"></span>
      </div>
      <div class="pv-stage" id="pvStage"></div>
    </div>
  </main>
</div>
<div class="pv-tooltip" id="pvTooltip" role="tooltip" hidden></div>
<dialog id="typesDlg" aria-labelledby="typesTitle">
  <div class="dlg-head"><span id="typesTitle"></span><button id="typesClose"></button></div>
  <div class="dlg-filter"><input type="search" id="typesFilter" autocomplete="off" spellcheck="false"></div>
  <div class="dlg-body" id="typesBody"></div>
</dialog>
<dialog id="langDlg" aria-labelledby="langTitle">
  <div class="dlg-head"><span id="langTitle"></span><button id="langClose"></button></div>
  <div class="dlg-filter"><input type="search" id="langFilter" autocomplete="off" spellcheck="false"></div>
  <div class="dlg-body" id="langBody"></div>
</dialog>
<dialog id="settingsDlg" aria-labelledby="settingsTitle">
  <div class="dlg-head"><span id="settingsTitle"></span><button id="settingsClose"></button></div>
  <div class="dlg-body">
    <div class="set-line"><label for="theme" id="themeLabel"></label><select id="theme"></select></div>
    <div class="set-line"><label for="depth" id="depthLabel"></label><select id="depth"></select></div>
    <label class="set-row"><input type="checkbox" id="fontLig"><span id="fontLigName"></span></label>
    <p class="set-desc" id="fontLigDesc"></p>
    <div class="font-sample" id="fontSample" aria-hidden="true"></div>
  </div>
</dialog>
<input type="file" id="dirInput" webkitdirectory multiple hidden>
